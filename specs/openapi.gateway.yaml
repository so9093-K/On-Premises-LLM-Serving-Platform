  /v1/chat/completions:
    post:
      tags:
      - Chat
      summary: 대화 응답 생성
      description: '`local-main`에 메시지 목록을 보내 대화 응답을 생성합니다. 지원 파라미터와 입력 종류는 활성 메인 모델
        프로필에 따라 달라집니다.


        아래 한도는 **기본 프로필** 기준입니다. 활성 프로필의 최신 값은 `GET /v1/models`의 `request_parameters`와
        `request_limits`에서 확인하세요.


        ### 요청 파라미터


        - 허용 파라미터: `stream`, `stream_options`, `temperature`, `max_tokens`, `top_p`,
        `top_k`, `min_p`, `presence_penalty`, `frequency_penalty`, `repetition_penalty`,
        `stop`, `seed`, `n`, `tools`, `tool_choice`, `parallel_tool_calls`, `reasoning`,
        `response_format`, `logprobs`, `top_logprobs`, `logit_bias`, `user`

        - `max_tokens`와 `max_completion_tokens`는 출력 토큰 한도를 지정합니다. 둘 중 하나만 사용하세요.

        - 메시지 역할: `system`, `developer`, `user`, `assistant`, 도구 호출 시 `tool`. 이 플랫폼은
        `developer`를 `system`과 동일하게 처리합니다.

        - 미지원 파라미터는 `422 VALIDATION_ERROR`입니다. `error.param`에서 필드명을 확인하세요.

        - `user`: Gateway에서만 처리하며 모델 런타임에 전달하지 않습니다.


        ### 입력·출력 한도


        - 컨텍스트 상한: 입력과 출력 합계 50,000토큰.

        - 요청별 출력 한도와 `n` 범위는 아래 요청 스키마를 따릅니다. 정확한 입력 토큰 수는 런타임이 토크나이저·대화 템플릿·미디어 전처리를
        적용해 계산합니다.

        - `max_tokens`를 생략하면 활성 런타임의 기본 출력 예산을 사용합니다. 입력과 출력 예산 합이 컨텍스트 상한을 넘으면 `422
        VALIDATION_ERROR`입니다.

        - 요청 본문 상한: 100,000,000바이트 (95.4 MiB)(base64 미디어 포함). 초과하면 `413 REQUEST_TOO_LARGE`입니다.


        ### 스트리밍과 응답 종료


        - `stream: true`로 SSE 응답을 받습니다. `stream_options.include_usage: true`로 마지막
        청크에 토큰 사용량을 포함합니다.

        - 스트림 상한: 300초, 20,000청크, 104,857,600바이트 (100.0 MiB).

        - HTTP 200 이후에도 SSE `error` 이벤트가 올 수 있습니다. 오류 이벤트·`finish_reason`·최종 `data:
        [DONE]`을 함께 확인하세요. `[DONE]` 누락은 정상 종료로 간주하지 마세요.

        - `finish_reason: length`는 출력 한도에 도달한 응답입니다. 추론이 출력 예산을 모두 사용하면 `content:
        null`과 비어 있지 않은 `reasoning`이 반환될 수 있습니다.


        ### 도구 호출


        - 지원: `true`. `tool_choice` 허용값: `auto`, `none`.

        - 지정 함수 선택 지원: `false`.

        - 병렬 호출 지원: `false`. 미지원 프로필에서는 `parallel_tool_calls: true`를 사용할 수 없습니다.


        ### 구조화 출력


        - `response_format.type` 허용값: `text`, `json_object`, `json_schema`.

        - `json_object`: 메시지에 JSON 출력을 지시해야 합니다. 특정 스키마와의 일치는 보장하지 않습니다.

        - `json_schema`: 루트 `object`, `additionalProperties: false`를 사용하세요. 선택 필드는
        nullable union(`["type", "null"]`)으로 표현하며 외부 `$ref`는 지원하지 않습니다.

        - 스키마 상한: 16,384바이트, 깊이 8, 전체 속성 64개.

        - 생성 결과가 스키마를 만족하지 못하면 `STRUCTURED_OUTPUT_INVALID`입니다. 스키마와 출력 토큰 한도를 확인하세요.
        숫자의 `minimum`·`maximum`, 문자열의 `maxLength`·`pattern`은 반복 출력을 줄이는 데 도움이 되지만
        정상 종료를 보장하지는 않습니다.


        ### 추론


        - `reasoning` 지원: `true`, 기본값: `false`.

        - `reasoning: true`로 활성화합니다. 추론 토큰도 출력 한도에 포함되므로 `max_tokens`를 함께 조정하세요.


        ### 토큰 확률과 재현성


        - `logprobs`와 `top_logprobs`: 토큰 확률을 반환합니다. `top_logprobs`에는 `logprobs: true`가
        필요합니다.

        - `logit_bias`: 활성 프로필의 토크나이저에 따른 토큰 ID를 사용합니다. 프로필 전환 후 ID가 달라질 수 있습니다.

        - `seed`: 재현성을 높이는 값이며 동일한 결과를 보장하지 않습니다.


        ### 멀티모달 입력


        지원 입력: `text`, `image`, `audio`, `video`. 미지원 입력·형식·크기는 `422 VALIDATION_ERROR`이며
        `error.param`에서 원인 필드를 확인할 수 있습니다.


        | 항목 | 이미지 | 오디오 | 비디오 |

        |---|---|---|---|

        | 최대 개수 | 1 | 1 | 1 |

        | 최대 크기 | 25,000,000바이트 (23.8 MiB) | 25,000,000바이트 (23.8 MiB) | 50,000,000바이트
        (47.7 MiB) |


        - 이미지 URL 형식: `data`. MIME 유형: `image/jpeg`, `image/png`, `image/webp`, `image/avif`,
        `image/jp2`, `image/gif`, `image/bmp`, `image/tiff`, `image/x-tiff`.

        - 오디오: 인라인 base64. 형식: `wav`, `mp3`, `flac`, `ogg`, `m4a`, `mp4`, `aac`.

        - 비디오 URL 형식: `data`. MIME 유형: `video/mp4`, `video/webm`, `video/x-matroska`,
        `video/quicktime`, `video/jpeg`, `video/x-msvideo`, `video/avi`, `video/gif`.

        - 이미지 해상도 상한: 12,845,056픽셀. 해상도를 확인할 수 없는 이미지는 거부합니다.

        - 비디오 상한: 60프레임, 60초, 프레임당 12,845,056픽셀.'
      operationId: createChatCompletion
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./schemas/chat_completion_request.schema.json
            examples:
              basic:
