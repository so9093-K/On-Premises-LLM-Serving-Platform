        준비 상태는 `/ready`에서 확인하세요.


        `request_parameters`는 모델별 허용 파라미터와 범위(`min`, `max`, `max_items`, `allowed`)를,
        `request_limits`는 입력 종류별 개수·크기 한도를 반환합니다. 요청 예시의 값은 Gateway 기본값과 다를 수 있습니다.


        `local-main`은 활성 메인 모델 프로필의 공개 이름입니다. 프로필 전환 후 입력 종류·토큰 한도·허용 파라미터가 달라질 수
        있으므로 응답의 최신 값을 사용하세요. 모델 목록에 포함돼 있어도 런타임은 중지 상태일 수 있습니다. 운영자는 `GET /admin/main-model/profiles`에서
        전환 후보와 검증 상태를 확인할 수 있습니다.'
      operationId: listModels
      responses:
        '200':
          description: 성공 응답
          content:
