        - `active`: 런타임을 시작하고 요청 라우팅을 복구합니다.

        - `stopped`: 런타임을 중지하고 GPU 메모리를 회수합니다.


        GPU 정책 예산이 부족하면 `409 GPU_BUDGET_EXCEEDED`와 중지 후보를 반환합니다. `force: true`는 낮은
        우선순위 보조 런타임의 자동 중지를 허용하므로 변경 계획에서 영향을 먼저 확인하세요. 적용·관측 검증 결과는 런타임 작업 이력에서 조회할
        수 있습니다.'
