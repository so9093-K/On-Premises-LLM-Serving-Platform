                value:
                  model: local-main
                  messages:
                  - role: user
                    content:
                    - type: text
                      text: 이 이미지가 무엇인지 설명해주세요.
                    - type: image_url
                      image_url:
                        url: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI6QAAAABJRU5ErkJggg==
                  max_tokens: 256
              with_audio:
                summary: 멀티모달 · 오디오(지원 프로필)
                value:
                  model: local-main
                  messages:
                  - role: user
                    content:
                    - type: text
                      text: 이 오디오에 어떤 소리가 들리는지 설명해주세요.
                    - type: input_audio
                      input_audio:
                        data: UklGRjQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YRAAAAAAAAAAAAAAAAAAAAAAAAAA
                        format: wav
                  max_tokens: 256
              with_video:
                summary: 멀티모달 · 비디오(지원 프로필)
                value:
                  model: local-main
                  messages:
                  - role: user
                    content:
                    - type: text
                      text: 이 비디오에서 보이는 장면을 설명해주세요.
                    - type: video_url
                      video_url:
                        url: data:video/mp4;base64,
                  max_tokens: 256
        required: true
