                  response_format:
                    type: json_object
                  max_tokens: 128
                  temperature: 0
              with_tools:
                summary: 도구 호출 · 함수 정의
                value:
                  model: local-main
                  messages:
                  - role: user
                    content: 서울의 현재 날씨가 어때요?
                  tools:
                  - type: function
                    function:
                      name: get_weather
                      description: 특정 위치의 날씨 정보를 조회합니다.
                      parameters:
                        type: object
                        properties:
                          location:
                            type: string
                            description: '도시 이름 (예: 서울)'
                        required:
                        - location
                  tool_choice: auto
                  parallel_tool_calls: false
              with_reasoning:
                summary: 추론 · 명시적 활성화
                value:
                  model: local-main
                  messages:
                  - role: user
                    content: 이 장애 원인을 단계적으로 분석하고 최종 조치만 정리해줘.
                  reasoning: true
                  max_tokens: 3072
                  temperature: 0.2
              json_schema:
                summary: 구조화 출력 · JSON 스키마
                value:
                  model: local-main
                  messages:
                  - role: user
                    content: Return JSON with a short answer.
                  response_format:
                    type: json_schema
                    json_schema:
                      name: short_answer
                      strict: true
                      schema:
                        type: object
                        additionalProperties: false
                        properties:
                          answer:
                            type: string
                        required:
                        - answer
              logprobs:
                summary: 진단 · 토큰 확률
                value:
                  model: local-main
                  messages:
                  - role: user
                    content: Say OK only.
                  logprobs: true
                  top_logprobs: 3
              with_image:
