                  summary: 보조 중지 — 실제 컨테이너 상태 재확인
                  value:
                    service_key: prompt_injection_detector
                    state: stopped
                    containers_stopped:
                    - prompt-injection-detector-runtime
                to_active:
                  summary: 보조 시작 (서비스 복구)
                  value:
                    service_key: embedding_ko
                    state: active
                    containers_started:
                    - embedding-ko-vllm
                to_active_prereq:
                  summary: 보조 시작 — 선행 컨테이너 포함
                  value:
                    service_key: prompt_injection_detector
                    state: active
                    containers_started:
                    - embedding-vllm
                    - prompt-injection-detector-runtime
                noop:
                  summary: 이미 목표 상태 (no-op)
                  value:
                    service_key: embedding
                    state: active
                    changed: false
                main_stopped:
                  summary: 메인 정지 (key=main, VRAM 회수)
                  value:
                    service_key: main
                    state: stopped
                    evicted: []
                main_active:
                  summary: 메인 시작 (key=main)
                  value:
                    service_key: main
                    state: active
                    evicted: []
                main_active_force:
                  summary: 메인 시작 + 보조 축출 (force)
