              schema:
                $ref: ./schemas/model_list_response.schema.json
        '401':
          description: '인증 실패


            오류 코드 (`error.code`):

            - `UNAUTHORIZED` — API 키 또는 인증 정보가 없거나 유효하지 않다. (재시도 불가)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./schemas/common_error.schema.json
                - type: object
                  properties:
                    error:
                      type: object
