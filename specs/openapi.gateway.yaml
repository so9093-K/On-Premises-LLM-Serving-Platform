# 자동 생성 파일입니다. 직접 수정하지 마세요.
# 소스: FastAPI routes + api/endpoint_spec.py + specs/schemas + configs
# 명령: make render-runtime-assets
openapi: 3.1.0
info:
  title: AI Model Serving Gateway
  description: "모델 응답 생성·텍스트 임베딩·문서 관련도 평가·위험 신호 탐지를 제공하는 Gateway API입니다.\n현재 모델별\
    \ 지원 기능과 요청 한도는 `GET /v1/models`에서 확인하세요.\n\n## 첫 호출\n\n아래 로컬 주소를 실제 Gateway 주소로\
    \ 바꾸세요. 사용자 인증이 활성화돼 있으면 `API_KEY`도 설정해야 합니다.\n\n```bash\nGATEWAY_URL='http://127.0.0.1:9400'\n\
    curl --fail-with-body \"$GATEWAY_URL/v1/chat/completions\" \\\n  -H \"Authorization:\
    \ Bearer $API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n\
    \    \"model\": \"local-main\",\n    \"messages\": [\n      {\"role\": \"user\"\
    , \"content\": \"안녕하세요\"}\n    ]\n  }'\n```\n\n응답의 `choices[0].message.content`,\
    \ `finish_reason`, `usage`를 확인하세요.\n요청 예시와 코드 샘플은 각 API의 요청 영역에서 선택할 수 있습니다.\n\
    \n## 인증\n\n- 사용자 API(`/v1/*`): `Authorization: Bearer <API_KEY>` (`bearerAuth`).\n\
    - 관리자 API(`/ready`, `/metrics`, 인증이 필요한 `/admin/*`): `Authorization: Bearer <ADMIN_API_KEY>`\
    \ (`adminBearerAuth`).\n\n사용자 API 키와 관리자 API 키는 서로 대체할 수 없습니다. 요청 창에서 해당 인증 항목을\
    \ 선택하세요.\n"
  contact:
    name: AI Model Serving Platform 운영
  version: 0.0.1
paths:
  /health:
    get:
      tags:
      - Operations
      summary: 프로세스 상태 확인
      description: 프로세스가 살아 있는지만 확인합니다. 항상 HTTP 200을 반환하며 인증 없이 호출할 수 있습니다.
      operationId: getGatewayHealth
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Getgatewayhealth
  /admin/control-plane/bootstrap:
    get:
      tags:
      - Operations
      summary: Control Plane 접속 정보 조회
      description: Control Plane 접속에 필요한 배포 환경·인증 요구 여부·지원 기능을 반환합니다. 인증 전에도 조회할 수
        있으며 API 키·내부 주소·호스트 경로는 포함하지 않습니다.
      operationId: getControlPlaneBootstrap
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                $ref: ./schemas/control_plane_bootstrap_response.schema.json
      x-response-contract-schema: control_plane_bootstrap_response.schema.json
  /ready:
    get:
      tags:
      - Operations
      summary: 서비스 준비 상태 확인
      description: 현재 배포의 필수 런타임과 Risk Signal Service가 요청을 받을 준비가 됐는지 확인합니다. 필수 의존
        서비스가 준비되지 않으면 HTTP 503을 반환합니다. `required_not_ready_dependencies`와 `optional_not_ready_dependencies`에서
        필수·선택 의존 서비스의 상태를 구분하세요.
      operationId: getGatewayReadiness
      responses:
        '200':
          description: 모든 dependency 준비 완료
          content:
            application/json:
              schema:
                $ref: ./schemas/readiness_response.schema.json
              example:
                status: ready
                service: gateway
                phase: serving
                not_ready_dependencies: []
                required_not_ready_dependencies: []
                optional_not_ready_dependencies: []
                dependencies:
                - name: main_llm_vllm
                  status: ready
                  endpoint: http://main-llm-vllm:9401/v1/models
                - name: embedding_vllm
                  status: ready
                  endpoint: http://embedding-vllm:9402/v1/models
                - name: risk-signal-service
                  status: ready
                  endpoint: http://risk-signal-service:9405/ready
        '401':
          description: '관리자 API 키 필요


            오류 코드 (`error.code`):

            - `UNAUTHORIZED` — API 키 또는 인증 정보가 없거나 유효하지 않다. (재시도 불가)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./schemas/common_error.schema.json
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - UNAUTHORIZED
        '503':
          description: 일부 dependency 로딩 중 또는 불가
          content:
            application/json:
              example:
                status: not_ready
                service: gateway
                phase: waiting_for_dependencies
                not_ready_dependencies:
                - risk-signal-service
                required_not_ready_dependencies:
                - risk-signal-service
                optional_not_ready_dependencies: []
                dependencies:
                - name: main_llm_vllm
                  status: ready
                  endpoint: http://main-llm-vllm:9401/v1/models
                - name: risk-signal-service
                  status: not_ready
                  endpoint: http://risk-signal-service:9405/ready
                  message: 'waiting for Risk Signal Service dependencies: prompt_injection_detector_runtime'
      security:
      - adminBearerAuth: []
      x-response-contract-schema: readiness_response.schema.json
  /admin/serving-envelope:
    get:
      tags:
      - Runtime Control
      summary: 모델 서빙 설정 조회
      description: '메인 모델의 요청 수·대기 시간 제한과 런타임 실행 설정을 조회합니다. 최대 사용자 수나 권장 동시 요청 수를
        의미하지 않습니다.


        동적 배포는 활성 프로필의 설정을, 정적 배포는 선택된 외부 런타임 프로필의 설정을 반환합니다. 정적 배포 응답은 외부 프로세스를 실시간
        관측한 값이 아닙니다.'
      operationId: getServingEnvelope
      responses:
        '200':
          description: 현재 Main Model의 resolved admission과 engine serving context
          content:
            application/json:
              schema:
                $ref: ./schemas/serving_envelope_response.schema.json
        '401':
          description: '관리자 API 키 필요


            오류 코드 (`error.code`):

            - `UNAUTHORIZED` — API 키 또는 인증 정보가 없거나 유효하지 않다. (재시도 불가)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./schemas/common_error.schema.json
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - UNAUTHORIZED
        '503':
          description: 'Dynamic target에서 active profile 또는 Runtime Controller 상태를
            확인할 수 없음


            오류 코드 (`error.code`):

            - `MAIN_MODEL_CONTROL_UNAVAILABLE` — 메인 모델 Runtime Controller를 사용할 수 없다.
            (재시도 가능)

            - `MODEL_UNAVAILABLE` — 대상 모델 런타임을 현재 사용할 수 없다(미기동·축출 등). (재시도 가능)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./schemas/common_error.schema.json
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - MAIN_MODEL_CONTROL_UNAVAILABLE
                          - MODEL_UNAVAILABLE
      security:
      - adminBearerAuth: []
      x-response-contract-schema: serving_envelope_response.schema.json
  /metrics:
    get:
      tags:
      - Monitoring
      summary: Prometheus 지표 조회
      description: Prometheus 형식의 Gateway 지표를 반환합니다. 관리자 인증 설정을 따릅니다.
      operationId: getGatewayMetrics
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema: {}
        '401':
          description: '관리자 API 키 필요


            오류 코드 (`error.code`):

            - `UNAUTHORIZED` — API 키 또는 인증 정보가 없거나 유효하지 않다. (재시도 불가)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./schemas/common_error.schema.json
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - UNAUTHORIZED
      security:
      - adminBearerAuth: []
  /admin/traffic/recent:
    get:
      tags:
      - Operations
      summary: 최근 공개 API 트래픽 요약 조회
      description: '최근 공개 API(`/v1/*`) 요청 결과와 지연 시간 요약입니다. 기본 집계 구간은 5분이며 Gateway
        재시작 시 초기화됩니다. 장기 추세는 Prometheus·Grafana에서 확인하세요.


        `completion_latency_seconds`는 비스트리밍 Chat Completions·Responses의 런타임 완료 시간,
        `time_to_first_chunk_seconds`는 스트리밍 첫 청크까지의 시간입니다. 백분위는 보간 없는 nearest-rank
        방식이며 `minimum_samples`보다 표본이 적으면 `null`입니다.'
      operationId: getRecentTraffic
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                $ref: ./schemas/recent_traffic_response.schema.json
        '401':
          description: '인증 실패


            오류 코드 (`error.code`):

            - `UNAUTHORIZED` — API 키 또는 인증 정보가 없거나 유효하지 않다. (재시도 불가)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./schemas/common_error.schema.json
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - UNAUTHORIZED
      security:
      - adminBearerAuth: []
      x-response-contract-schema: recent_traffic_response.schema.json
  /admin/config/schema:
    get:
      tags:
      - Operations
      summary: 설정 항목 정의 조회
      description: 설정 항목의 이름·허용값·소유자·민감도·적용 방식을 반환합니다. 운영자 소유 항목 중 `editable=true`인
        항목만 변경할 수 있습니다.
      operationId: getConfigurationSchema
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                $ref: ./schemas/configuration_schema_response.schema.json
        '401':
          description: '인증 실패


            오류 코드 (`error.code`):

            - `UNAUTHORIZED` — API 키 또는 인증 정보가 없거나 유효하지 않다. (재시도 불가)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./schemas/common_error.schema.json
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - UNAUTHORIZED
      security:
      - adminBearerAuth: []
      x-response-contract-schema: configuration_schema_response.schema.json
  /admin/config/effective:
    get:
      tags:
      - Operations
      summary: 현재 적용된 설정 조회
      description: 현재 적용된 설정값과 출처를 반환합니다. 시크릿 원문은 반환하지 않습니다. 변경 계획과 적용에는 응답의 `revision`과
        HTTP `ETag`를 사용하세요.
      operationId: getEffectiveConfiguration
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                $ref: ./schemas/configuration_effective_response.schema.json
        '401':
          description: '인증 실패


            오류 코드 (`error.code`):

            - `UNAUTHORIZED` — API 키 또는 인증 정보가 없거나 유효하지 않다. (재시도 불가)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./schemas/common_error.schema.json
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - UNAUTHORIZED
      security:
      - adminBearerAuth: []
      x-response-contract-schema: configuration_effective_response.schema.json
  /admin/config/history:
    get:
      tags:
      - Operations
      summary: 설정 변경 이력 조회
      description: 설정 변경 이력을 최신 순서로 반환합니다. 다음 페이지는 `cursor`로 조회하세요. 내부 복구 스냅샷과 원시
        오류 문자열은 포함하지 않습니다.
      operationId: listConfigurationHistory
      security:
      - adminBearerAuth: []
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                $ref: ./schemas/configuration_history_response.schema.json
        '401':
          description: '인증 실패


            오류 코드 (`error.code`):

            - `UNAUTHORIZED` — API 키 또는 인증 정보가 없거나 유효하지 않다. (재시도 불가)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./schemas/common_error.schema.json
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - UNAUTHORIZED
        '422':
          description: '요청 검증 실패


            오류 코드 (`error.code`):

            - `VALIDATION_ERROR` — 요청이 Gateway 입력 계약 검증을 통과하지 못했다. (재시도 불가)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./schemas/common_error.schema.json
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - VALIDATION_ERROR
        '503':
          description: '런타임 또는 의존 서비스를 사용할 수 없음


            오류 코드 (`error.code`):

            - `CONFIGURATION_WRITE_UNAVAILABLE` — 설정 저장소·적용 상태·작업 이력에 문제가 있어 변경을 시작할
            수 없다. (재시도 불가)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./schemas/common_error.schema.json
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - CONFIGURATION_WRITE_UNAVAILABLE
      parameters:
      - name: limit
        in: query
        required: false
        description: 한 페이지에 반환할 operation 수입니다. 기본 50, 최대 200입니다.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        required: false
        description: 직전 History 응답의 `next_cursor`입니다.
        schema:
          type: string
          minLength: 1
      x-response-contract-schema: configuration_history_response.schema.json
  /admin/config/plans:
    post:
      tags:
      - Operations
      summary: 설정 변경 계획 검토
      description: 현재 리비전에서 `set`·`reset`의 유효성과 변경 영향을 검토합니다. 실제 저장 없이 변경 전후 값·적용
        방식·위험도·`plan_digest`를 반환합니다. 적용할 때 같은 변경 내용과 다이제스트를 사용하세요.
      operationId: planConfigurationChange
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                $ref: ./schemas/configuration_plan_response.schema.json
        '401':
          description: '인증 실패


            오류 코드 (`error.code`):

            - `UNAUTHORIZED` — API 키 또는 인증 정보가 없거나 유효하지 않다. (재시도 불가)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./schemas/common_error.schema.json
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - UNAUTHORIZED
        '413':
          description: '요청 본문 크기 초과


            오류 코드 (`error.code`):

            - `REQUEST_TOO_LARGE` — 요청 본문이 허용 한도를 초과했다. (재시도 불가)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./schemas/common_error.schema.json
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - REQUEST_TOO_LARGE
        '422':
          description: '요청 검증 실패


            오류 코드 (`error.code`):

            - `VALIDATION_ERROR` — 요청이 Gateway 입력 계약 검증을 통과하지 못했다. (재시도 불가)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./schemas/common_error.schema.json
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - VALIDATION_ERROR
        '500':
          description: '내부 서버 오류


            오류 코드 (`error.code`):

            - `INTERNAL_ERROR` — Gateway 내부 처리 중 예기치 못한 오류가 발생했다. (재시도 불가)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./schemas/common_error.schema.json
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - INTERNAL_ERROR
        '412':
          description: '사전 조건 또는 리비전 불일치


            오류 코드 (`error.code`):

            - `CONFIG_REVISION_CONFLICT` — 검토한 설정 리비전 또는 변경 계획이 현재 상태와 달라졌다. (재시도
            불가)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./schemas/common_error.schema.json
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - CONFIG_REVISION_CONFLICT
        '503':
          description: '런타임 또는 의존 서비스를 사용할 수 없음


            오류 코드 (`error.code`):

            - `CONFIGURATION_WRITE_UNAVAILABLE` — 설정 저장소·적용 상태·작업 이력에 문제가 있어 변경을 시작할
            수 없다. (재시도 불가)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./schemas/common_error.schema.json
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - CONFIGURATION_WRITE_UNAVAILABLE
      security:
      - adminBearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./schemas/configuration_plan_request.schema.json
        required: true
      x-contract-schema: configuration_plan_request.schema.json
      x-response-contract-schema: configuration_plan_response.schema.json
  /admin/config:
    patch:
      tags:
      - Operations
      summary: 검토한 설정 변경 적용
      description: '`If-Match: "config-<revision>"`과 계획에서 받은 `plan_digest`를 함께 보내세요.
        리비전이나 검토한 변경 내용이 달라지면 적용을 거부합니다. 저장 후 같은 리비전이 런타임에 적용됐는지 검증합니다. `reset`은 운영자
