      description: '전환 작업의 결과·진행 단계·실패 원인을 조회합니다.


        - `status`: 작업 상태·결과. `completed`, `failed`, `rollback_failed`는 종료 상태입니다.

        - `stage`: 진행 단계 또는 실패 지점. `status`와 다를 수 있습니다.

        - `error`: 전환 실패 원인.

        - `rollback_error`: 이전 프로필 복구 실패 원인. `rollback_failed`이면 수동 복구가 필요합니다.

        - `client_request_id`: 전환 요청의 멱등 키.


        종료 상태가 될 때까지 조회하세요. 가장 최근 작업은 `GET /admin/main-model`의 `last_operation`에서도
        확인할 수 있습니다.'
      operationId: getMainModelOperation
      security:
      - adminBearerAuth: []
      responses:
        '200':
          description: 전환 작업 상태
          content:
            application/json:
              schema:
                $ref: ./schemas/main_model_operation_response.schema.json
              examples:
                in_progress:
                  summary: 진행 중 (validating)
                  value:
                    id: 41cf50bb-60b2-4dbc-b38a-7dd07da91d97
                    requested_profile: gemma4-12b-unified-fp8
                    previous_profile: gemma4-26b-a4b-fp8
                    client_request_id: ops-20260622-12b
                    status: validating
                    stage: validating
                    recovered_after_restart: false
                    created_at: 1782086105.78
                    updated_at: 1782086230.12
                completed:
                  summary: 완료
                  value:
                    id: 41cf50bb-60b2-4dbc-b38a-7dd07da91d97
                    requested_profile: gemma4-12b-unified-fp8
                    previous_profile: gemma4-26b-a4b-fp8
                    client_request_id: ops-20260622-12b
                    status: completed
                    stage: completed
                    recovered_after_restart: false
                    created_at: 1782086105.78
                    updated_at: 1782086258.2
                failed:
                  summary: 실패 후 이전 프로필 복구
                  value:
                    id: 41cf50bb-60b2-4dbc-b38a-7dd07da91d97
                    requested_profile: gemma4-12b-unified-fp8
                    previous_profile: gemma4-26b-a4b-fp8
                    client_request_id: ops-20260622-12b
                    status: failed
                    stage: validating
                    error: 'runtime validation failed: /v1/models did not report local-main'
                    recovered_after_restart: false
                    created_at: 1782086105.78
                    updated_at: 1782086240.55
        '404':
          description: 'operation 없음 (id 오타이거나 만료/미존재)


            오류 코드 (`error.code`):

            - `NOT_FOUND` — 요청한 리소스(경로·작업 ID 등)가 존재하지 않는다. (재시도 불가)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./schemas/common_error.schema.json
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - NOT_FOUND
        '503':
          description: 'Runtime Controller 연결 실패


            오류 코드 (`error.code`):

            - `MAIN_MODEL_CONTROL_UNAVAILABLE` — 메인 모델 Runtime Controller를 사용할 수 없다.
            (재시도 가능)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./schemas/common_error.schema.json
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - MAIN_MODEL_CONTROL_UNAVAILABLE
        '401':
          description: '인증 실패


            오류 코드 (`error.code`):

            - `UNAUTHORIZED` — API 키 또는 인증 정보가 없거나 유효하지 않다. (재시도 불가)'
          content:
            application/json:
              schema:
                allOf:
                - $ref: ./schemas/common_error.schema.json
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - UNAUTHORIZED
      parameters:
      - name: operation_id
        in: path
        required: true
        description: switch 202 응답의 `operation_id` (UUID).
        schema:
          type: string
          format: uuid
        example: 41cf50bb-60b2-4dbc-b38a-7dd07da91d97
      x-response-contract-schema: main_model_operation_response.schema.json
components:
  schemas: {}
  securitySchemes:
    adminBearerAuth:
      type: http
      description: /ready, /metrics 같은 운영자 endpoint에 사용하는 admin Bearer token입니다.
      scheme: bearer
    bearerAuth:
      type: http
      description: Gateway API 또는 내부 Risk Signal Service 호출에 사용하는 Bearer token입니다.
      scheme: bearer
tags:
- name: Models
  description: 'Gateway가 호출자에게 공개하는 모델 목록입니다. 아래 표는 이 배포 설정에서 자동으로 만들어지며, 지금 실제로 적용
    중인 값은 `GET /v1/models` 응답에서 확인하세요.


    | 모델 | 입력 | 기능 |

    |---|---|---|

    | `local-main` | `text`, `image`, `audio`, `video` | `chat.completions`, `chat.completions.vision`,
    `chat.completions.tools`, `responses` |

    | `local-embed` | `text` | `embeddings`, `retrieval_rerank`, `retrieval_score`
    |

    | `local-embed-ko` | `text` | `embeddings`, `retrieval_rerank`, `retrieval_score`
    |

    | `risk-prompt` | `text` | `risk.prompt_attack_signal` |


    - `risk-prompt`는 조정 가능한 파라미터가 없습니다. `max_tokens=1`, `temperature=0`으로 고정입니다.'
- name: Chat
  description: 메시지 목록으로 모델 응답을 생성하는 OpenAI 호환 Chat Completions API입니다. 스트리밍·도구 호출·구조화
    출력·멀티모달 입력의 지원 범위는 활성 프로필에 따라 다릅니다. 현재 기능과 한도는 `GET /v1/models`에서 확인하세요.
- name: Responses
  description: 항목 기반 입력·출력과 이벤트 유형별 스트리밍을 제공하는 OpenAI 호환 Responses API입니다. Chat Completions와
    같은 활성 메인 모델을 사용합니다. 대화를 이어가려면 이전 응답과 도구 실행 결과를 다음 요청의 `input`에 포함하세요. 서버는 응답을
    저장하지 않습니다.
- name: Embeddings
  description: 'OpenAI 호환 embedding API입니다. 모델마다 출력 차원이 고정되어 있고, Gateway가 요청 차원과 응답
    차원이 일치하는지 확인합니다.


    - `local-embed` — 기본 768차원

    - `local-embed-ko` — 기본 1,024차원


    요청 파라미터와 한도는 아래 `POST /v1/embeddings` 설명에 있습니다.'
- name: Retrieval
  description: 텍스트 임베딩의 코사인 유사도로 문서 관련도를 평가합니다. 기본 모델은 `local-embed-ko`이며 `local-embed`도
    선택할 수 있습니다.
- name: Risk
  description: '개인정보·시크릿 노출과 프롬프트 공격의 탐지 신호를 반환합니다. 최종 허용·차단은 호출 애플리케이션이 결정합니다.


    - PII Protection: 개인정보 탐지(D1, D2, D5).

    - Secret Exposure: 시크릿·자격증명 탐지(D4, D5).

    - Prompt: 프롬프트 인젝션·시스템 프롬프트 유출 탐지(A1, A2).


    HTTP 200이어도 `status=failed` 또는 `assessment_complete=false`이면 탐지가 완료되지 않은 결과입니다.
    이때 `risk_detected=false`를 안전 판정으로 사용하지 마세요.'
- name: Runtime Control
  description: '메인 모델과 보조 런타임의 상태·프로필을 관리합니다. 관리자 인증이 활성화된 배포에서는 관리자 API 키를 사용하세요.


    ### 시작·중지


    1. `GET /admin/runtimes`에서 상태를 조회합니다.

    2. `POST /admin/runtimes/{service_key}/plans`로 변경 영향을 확인합니다.

    3. 같은 변경 내용과 반환된 `plan_digest`로 `PATCH /admin/runtimes/{service_key}`를 호출합니다.
    메인 모델의 키는 `main`입니다.


    `vram_fraction`과 `budget`은 동시 실행 판단에 사용하는 **GPU 정책 예약 비율**입니다. 실측 GPU 메모리 사용량이
    아닙니다. `force: true`는 계획에 포함된 낮은 우선순위 보조 런타임의 자동 중지를 허용합니다.


    ### 메인 모델 전환


    `POST /admin/main-model/switch`는 `202`와 `operation_id`를 반환합니다. `GET /admin/main-model/operations/{operation_id}`로
    결과를 확인하세요. 전환·중지 중 요청 수락이 차단되면 Chat Completions와 Responses는 `503 MAIN_MODEL_SWITCH_IN_PROGRESS`와
    `Retry-After`를 반환합니다.


    | 단계 (`stage`) | 의미 |

    |---|---|

    | `pending` | 작업 접수 |

    | `preparing` | 이미지·가중치 준비 |

    | `draining` | 요청 수락을 차단하고 진행 중인 요청 완료 대기 |

    | `stopping` | 이전 런타임 중지 |

    | `starting` | 새 런타임 시작 |

    | `validating` | 추론 요청으로 런타임 검증 |

    | `rolling_back` | 이전 프로필 복구 |

    | `completed` | 전환 완료 |

    | `failed` | 전환 실패 |

    | `rollback_failed` | 복구 실패, 수동 조치 필요 |


    `status`는 작업 상태·결과이며 `stage`는 진행 단계 또는 실패 지점입니다. 예를 들어 검증 실패 후 복구에 성공해도 `status=failed`,
    `stage=validating`이 남을 수 있습니다. `status=rollback_failed`이면 수동 복구가 필요합니다.'
- name: Operations
  description: '`/health`는 프로세스 상태, `/ready`는 배포에서 필수로 사용하는 런타임과 Risk Signal Service의
    준비 상태를 확인합니다.


    ### 요청 추적과 오류 처리


    | 항목 | 용도 |

    |---|---|

    | `X-Request-Id` | 요청 추적 ID. 서버 접근 로그의 `request_id`와 같습니다 |

    | `X-Error-Code` / `error.code` | 같은 HTTP 상태에서도 구분되는 오류 원인 |

    | `error.param` | 수정할 요청 필드 |

    | `error.retryable` | 오류의 재시도 가능 여부 |

    | `Retry-After` | 재시도 전 대기 시간(초) |


    각 API의 오류 응답에서 코드별 의미를 확인하세요. 재시도 전에는 같은 작업을 다시 실행해도 되는지 확인해야 합니다.


    - `422`: `error.param`과 모델의 `request_parameters`·`request_limits`를 확인하세요.

    - `503`: `error.code`와 `/ready`의 의존 서비스 상태를 확인하세요. 모델 전환 중이면 완료를 기다리세요.

    - 스트리밍: HTTP 200만으로 성공을 판단하지 말고 SSE 오류 이벤트와 최종 종료 이벤트를 확인하세요.

    '
- name: Monitoring
  description: Prometheus 형식의 Gateway 지표를 조회합니다. 관리자 인증 설정을 따릅니다.
