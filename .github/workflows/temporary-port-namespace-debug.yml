name: Temporary Port Namespace E2E
on:
  push:
    branches: [refactor/port-namespace-policy-9600]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ui/control-plane/.nvmrc
      - name: Prepare
        run: |
          npm install --global "npm@$(node -p "require('./ui/control-plane/package.json').engines.npm")"
          make setup-dev PYTHON_BIN=python
      - name: Migrate 9600 to 9700
        run: make ports BASE=9700 YES=1
      - name: Test post migration contracts
        run: make app-check
      - name: Verify idempotency
        run: make ports BASE=9700 YES=1
      - name: Round trip
        run: make ports BASE=9600 YES=1
