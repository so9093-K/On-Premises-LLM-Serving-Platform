name: Validate and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 새 PR 커밋이 도착하면 이전 검증만 취소한다. main 검증과 CI Gate는 유지한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    name: Select required validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app_tests: ${{ steps.select.outputs.app_tests }}
      macos: ${{ steps.select.outputs.macos }}
      console: ${{ steps.select.outputs.console }}
      browser: ${{ steps.select.outputs.browser }}
      platform_image: ${{ steps.select.outputs.platform_image }}
      loki: ${{ steps.select.outputs.loki }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Select checks from source changes
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Git diff 실패를 정상적인 부분 경로 목록으로 처리하지 않는다.
          set -euo pipefail
          if [[ "${EVENT}" == "workflow_dispatch" ]]; then
            python3 scripts/validation/ci_impact.py --full --github-output "${GITHUB_OUTPUT}"
          else
            changed_paths="$(mktemp)"
            trap 'rm -f "${changed_paths}"' EXIT
            if git diff --no-renames --name-only -z "${BASE_SHA}" "${HEAD_SHA}" > "${changed_paths}"; then
              python3 scripts/validation/ci_impact.py --github-output "${GITHUB_OUTPUT}" < "${changed_paths}"
            else
              echo "::warning::Unable to compare commits; running full validation."
              python3 scripts/validation/ci_impact.py --full --github-output "${GITHUB_OUTPUT}"
            fi
          fi
  app-contract:
    needs: impact
    name: App and contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.impact.outputs.matrix) }}
    steps:
      # 외부 action은 이 저장소의 다른 모든 외부 아티팩트와 같이 commit SHA로
      # 고정한다. 태그는 재지정될 수 있어 같은 커밋이 다른 코드로 빌드된다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # 두 job은 공통 Platform lock의 지원 minor를 대표한다. Native runtime
          # exact patch와 image digest qualification은 이 workflow의 책임이 아니다.
          python-version: "${{ matrix.python_version }}"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # pyproject.toml의 required-version 범위에서 최신 patch를 검증한다.
          # dependency 결과는 uv.lock + --locked가 고정하고, 새 uv minor는 별도
          # qualification 없이 이 workflow에 들어오지 않는다.
          resolution-strategy: highest
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare developer environment
        run: make setup-dev PYTHON_BIN=python
      - name: Install Nginx for real remote API isolation tests
        if: matrix.os == 'ubuntu-24.04' && needs.impact.outputs.app_tests == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
      - name: Check application and contracts
        id: app_validation
        env:
          RUN_APP_TESTS: ${{ needs.impact.outputs.app_tests }}
          REQUIRE_NGINX_TESTS: ${{ matrix.os == 'ubuntu-24.04' && needs.impact.outputs.app_tests == 'true' && '1' || '0' }}
        run: |
          if [[ "${RUN_APP_TESTS}" == "true" ]]; then
            make app-check
          elif [[ "${RUN_APP_TESTS}" == "false" ]]; then
            make validate
          else
            echo "Invalid application validation decision: ${RUN_APP_TESTS}" >&2
            exit 1
          fi
      - name: Archive application validation results
        if: ${{ always() && steps.app_validation.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-validation-${{ matrix.os }}
          path: reports/validation/
          if-no-files-found: error
          retention-days: 7
  console:
    needs: impact
    if: needs.impact.outputs.console == 'true'
    name: Control Plane frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ui/control-plane/.nvmrc
          cache: npm
          cache-dependency-path: ui/control-plane/package-lock.json
      - name: Pin npm toolchain
        run: npm install --global "npm@$(node -p "require('./ui/control-plane/package.json').engines.npm")"
      - name: Check Control Plane source and generated Console
        id: console_validation
        run: make console-check
      - name: Archive frontend validation results
        if: ${{ always() && steps.console_validation.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-validation
          path: reports/validation/
          if-no-files-found: error
          retention-days: 7

  platform-image:
    needs: impact
    if: needs.impact.outputs.platform_image == 'true'
    name: Platform image build and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Dockerfile/build semantics stay in the provider-neutral repository command.
      # This job only verifies that the exact source under review still produces a
      # runnable Linux Platform image; it does not publish or promote the image.
      - name: Build and smoke-test Platform image
        env:
          PLATFORM_IMAGE: ai-model-serving-platform:ci-${{ github.sha }}
          PLATFORM_BUILD_PLATFORM: linux/amd64
        run: make build-image

  loki-query-smoke:
    needs: impact
    if: needs.impact.outputs.loki == 'true'
    name: Loki Runtime LogQL smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start pinned Loki (loopback only)
        run: |
          image="$(sed -n 's/^LOKI_IMAGE=//p' .env.compose.example)"
          test -n "$image"
          docker run --detach --name loki-query-smoke \
            --publish 127.0.0.1:3100:3100 \
            --tmpfs /loki:rw,mode=1777 \
            --env LOKI_RETENTION_HOURS=168 \
            --volume "$PWD/ops/loki/loki-config.yml:/etc/loki/loki-config.yml:ro" \
            "$image" -config.file=/etc/loki/loki-config.yml -config.expand-env=true
      - name: Query real Loki with synthetic labeled runtime logs
        run: python3 scripts/validation/grafana_loki_smoke.py
      - name: Loki diagnostics on failure
        if: failure()
        run: docker logs loki-query-smoke --tail 120

  operator-browser:
    needs: impact
    if: needs.impact.outputs.browser == 'true'
    name: Chromium operator workflows (desktop/mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ui/control-plane/.nvmrc
          cache: npm
          cache-dependency-path: ui/control-plane/package-lock.json
      - name: Pin npm and install frontend
        run: |
          npm install --global "npm@$(node -p "require('./ui/control-plane/package.json').engines.npm")"
          npm --prefix ui/control-plane ci
      - name: Install pinned browser runner
        run: |
          python3 -m venv /tmp/ux-playwright
          /tmp/ux-playwright/bin/pip install playwright==1.56.0
          /tmp/ux-playwright/bin/python -m playwright install --with-deps chromium
      - name: Build Console from source for browser smoke
        run: npm --prefix ui/control-plane run build
      - name: Start built Console preview
        run: |
          (cd ui/control-plane && npm exec -- vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/vite-preview.log 2>&1 &)
      - name: Verify actual Chromium workflows
        id: browser_validation
        run: /tmp/ux-playwright/bin/python scripts/validation/run_suite.py playwright
      - name: Archive browser validation results
        if: ${{ always() && steps.browser_validation.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-validation
          path: reports/validation/
          if-no-files-found: error
          retention-days: 7
      - name: Archive diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operator-ux-chromium
          path: /tmp/operator-ux-browser/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Preview diagnostics on failure
        if: failure()
        run: cat /tmp/vite-preview.log

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - impact
      - app-contract
      - console
      - platform-image
      - loki-query-smoke
      - operator-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require actual success or explicit skip
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          APP_CONTRACT_RESULT: ${{ needs.app-contract.result }}
          APP_TESTS_REQUIRED: ${{ needs.impact.outputs.app_tests }}
          MACOS_REQUIRED: ${{ needs.impact.outputs.macos }}
          CONSOLE_RESULT: ${{ needs.console.result }}
          CONSOLE_REQUIRED: ${{ needs.impact.outputs.console }}
          PLATFORM_IMAGE_RESULT: ${{ needs.platform-image.result }}
          PLATFORM_IMAGE_REQUIRED: ${{ needs.impact.outputs.platform_image }}
          LOKI_RESULT: ${{ needs.loki-query-smoke.result }}
          LOKI_REQUIRED: ${{ needs.impact.outputs.loki }}
          BROWSER_RESULT: ${{ needs.operator-browser.result }}
          BROWSER_REQUIRED: ${{ needs.impact.outputs.browser }}
        run: |
          if [[ "${IMPACT_RESULT}" != "success" || "${APP_CONTRACT_RESULT}" != "success" ]]; then
            echo "Impact selection and app validation must succeed." >&2
            exit 1
          fi
          # 앱 테스트 판정 누락은 make validate 단독 실행으로 조용히 강등할 수 없다.
          if [[ "${APP_TESTS_REQUIRED}" != "true" && "${APP_TESTS_REQUIRED}" != "false" ]]; then
            echo "Missing application test decision." >&2
            exit 1
          fi
          if [[ "${MACOS_REQUIRED}" != "${APP_TESTS_REQUIRED}" ]]; then
            echo "Inconsistent macOS and application test decisions." >&2
            exit 1
          fi
          require_optional() {
            local name="$1" required="$2" result="$3" expected
            if [[ "${required}" == "true" ]]; then
              expected=success
            elif [[ "${required}" == "false" ]]; then
              expected=skipped
            else
              echo "Missing required-check decision: ${name}" >&2
              return 1
            fi
            printf "%s required=%s result=%s\n" "${name}" "${required}" "${result}"
            if [[ "${result}" != "${expected}" ]]; then
              echo "${name}: expected ${expected}, got ${result}" >&2
              return 1
            fi
          }
          require_optional console "${CONSOLE_REQUIRED}" "${CONSOLE_RESULT}"
          require_optional platform_image "${PLATFORM_IMAGE_REQUIRED}" "${PLATFORM_IMAGE_RESULT}"
          require_optional loki "${LOKI_REQUIRED}" "${LOKI_RESULT}"
          require_optional browser "${BROWSER_REQUIRED}" "${BROWSER_RESULT}"
