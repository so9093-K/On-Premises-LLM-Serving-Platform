name: Validate and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-contract:
    name: App and contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python_version: "3.12"
          - os: macos-15
            python_version: "3.13"
    steps:
      # 외부 action은 이 저장소의 다른 모든 외부 아티팩트와 같이 commit SHA로
      # 고정한다. 태그는 재지정될 수 있어 같은 커밋이 다른 코드로 빌드된다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # 두 job은 공통 Platform lock의 지원 minor를 대표한다. Native runtime
          # exact patch와 image digest qualification은 이 workflow의 책임이 아니다.
          python-version: "${{ matrix.python_version }}"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # pyproject.toml의 required-version 범위에서 최신 patch를 검증한다.
          # dependency 결과는 uv.lock + --locked가 고정하고, 새 uv minor는 별도
          # qualification 없이 이 workflow에 들어오지 않는다.
          resolution-strategy: highest
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare developer environment
        run: make setup-dev PYTHON_BIN=python
      - name: Install Nginx for real remote API isolation tests
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
      - name: Check application and contracts
        id: app_validation
        run: make app-check
        env:
          REQUIRE_NGINX_TESTS: ${{ matrix.os == 'ubuntu-24.04' && '1' || '0' }}
      - name: Archive application validation results
        if: ${{ always() && steps.app_validation.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-validation-${{ matrix.os }}
          path: reports/validation/
          if-no-files-found: error
          retention-days: 7
  console:
    name: Control Plane frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: ui/control-plane/package-lock.json
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.0
      - name: Rebuild Console assets for this PR branch only (temporary)
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'refactor/user-facing-docs-and-copy' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/refactor/user-facing-docs-and-copy
          git switch -C ux-build-sync FETCH_HEAD
          npm --prefix ui/control-plane ci
          npm --prefix ui/control-plane run build
          git add -A src/ai_model_serving/static/control-plane
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(console): 사용자 표시 문구의 빌드 산출물을 동기화한다"
            git push origin HEAD:refs/heads/refactor/user-facing-docs-and-copy
          fi
      - name: Check Control Plane source and generated Console
        id: console_validation
        run: make console-check
      - name: Archive frontend validation results
        if: ${{ always() && steps.console_validation.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-validation
          path: reports/validation/
          if-no-files-found: error
          retention-days: 7

  platform-image:
    name: Platform image build and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Dockerfile/build semantics stay in the provider-neutral repository command.
      # This job only verifies that the exact source under review still produces a
      # runnable Linux Platform image; it does not publish or promote the image.
      - name: Build and smoke-test Platform image
        env:
          PLATFORM_IMAGE: ai-model-serving-platform:ci-${{ github.sha }}
          PLATFORM_BUILD_PLATFORM: linux/amd64
        run: make build-image

  loki-query-smoke:
    name: Loki Runtime LogQL smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start pinned Loki (loopback only)
        run: |
          image="$(sed -n 's/^LOKI_IMAGE=//p' .env.compose.example)"
          test -n "$image"
          docker run --detach --name loki-query-smoke \
            --publish 127.0.0.1:3100:3100 \
            --tmpfs /loki:rw,mode=1777 \
            --env LOKI_RETENTION_HOURS=168 \
            --volume "$PWD/ops/loki/loki-config.yml:/etc/loki/loki-config.yml:ro" \
            "$image" -config.file=/etc/loki/loki-config.yml -config.expand-env=true
      - name: Query real Loki with synthetic labeled runtime logs
        run: python3 scripts/validation/grafana_loki_smoke.py
      - name: Loki diagnostics on failure
        if: failure()
        run: docker logs loki-query-smoke --tail 120

  operator-browser:
    name: Chromium operator workflows (desktop/mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: ui/control-plane/package-lock.json
      - name: Pin npm and install frontend
        run: |
          npm install --global npm@11.19.0
          npm --prefix ui/control-plane ci
      - name: Install pinned browser runner
        run: |
          python3 -m venv /tmp/ux-playwright
          /tmp/ux-playwright/bin/pip install playwright==1.56.0
          /tmp/ux-playwright/bin/python -m playwright install --with-deps chromium
      - name: Build Console from source for browser smoke
        run: npm --prefix ui/control-plane run build
      - name: Start built Console preview
        run: |
          (cd ui/control-plane && npm exec -- vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/vite-preview.log 2>&1 &)
      - name: Verify actual Chromium workflows
        id: browser_validation
        run: /tmp/ux-playwright/bin/python scripts/validation/run_suite.py playwright
      - name: Archive browser validation results
        if: ${{ always() && steps.browser_validation.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-validation
          path: reports/validation/
          if-no-files-found: error
          retention-days: 7
      - name: Archive diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operator-ux-chromium
          path: /tmp/operator-ux-browser/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Preview diagnostics on failure
        if: failure()
        run: cat /tmp/vite-preview.log

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - app-contract
      - console
      - platform-image
      - loki-query-smoke
      - operator-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require validation jobs
        env:
          APP_CONTRACT_RESULT: ${{ needs.app-contract.result }}
          CONSOLE_RESULT: ${{ needs.console.result }}
          PLATFORM_IMAGE_RESULT: ${{ needs.platform-image.result }}
          LOKI_QUERY_RESULT: ${{ needs.loki-query-smoke.result }}
          OPERATOR_BROWSER_RESULT: ${{ needs.operator-browser.result }}
        run: |
          printf 'app-contract: %s\n' "${APP_CONTRACT_RESULT}"
          printf 'console: %s\n' "${CONSOLE_RESULT}"
          printf 'platform-image: %s\n' "${PLATFORM_IMAGE_RESULT}"

          if [[ "${APP_CONTRACT_RESULT}" != "success" ]]; then
            echo "App and contracts did not succeed." >&2
            exit 1
          fi

          if [[ "${CONSOLE_RESULT}" != "success" ]]; then
            echo "Control Plane frontend did not succeed." >&2
            exit 1
          fi

          if [[ "${OPERATOR_BROWSER_RESULT}" != "success" ]]; then
            echo "Chromium operator UX smoke did not succeed." >&2
            exit 1
          fi

          if [[ "${LOKI_QUERY_RESULT}" != "success" ]]; then
            echo "Loki Runtime LogQL smoke did not succeed." >&2
            exit 1
          fi

          if [[ "${PLATFORM_IMAGE_RESULT}" != "success" ]]; then
            echo "Platform image build and smoke did not succeed." >&2
            exit 1
          fi

