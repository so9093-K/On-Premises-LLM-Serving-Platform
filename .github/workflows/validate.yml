name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: macos-15
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          resolution-strategy: highest
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare Python environment
        run: make setup-dev PYTHON_BIN=python
      - name: Run pytest
        run: make test
      - name: Check lint and generated assets
        if: matrix.os == 'ubuntu-24.04'
        run: make validate

  frontend:
    name: Frontend (Unit + Build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ui/control-plane/.nvmrc
          cache: npm
          cache-dependency-path: ui/control-plane/package-lock.json
      - name: Pin npm
        run: npm install --global "npm@$(node -p "require('./ui/control-plane/package.json').engines.npm")"
      - name: Prepare frontend runners
        run: bash scripts/quality/setup_runners.sh
      - name: Run Vitest
        run: python3 scripts/quality_cli.py run frontend
      - name: Check source and production bundle
        run: npm --prefix ui/control-plane run check:source

  browser:
    name: Browser (Chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ui/control-plane/.nvmrc
          cache: npm
          cache-dependency-path: ui/control-plane/package-lock.json
      - name: Pin npm
        run: npm install --global "npm@$(node -p "require('./ui/control-plane/package.json').engines.npm")"
      - name: Prepare frontend runners
        run: bash scripts/quality/setup_runners.sh
      - name: Install Chromium
        run: npm --prefix ui/control-plane exec -- playwright install --with-deps chromium
      - name: Run Playwright
        run: python3 scripts/quality_cli.py run browser
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chromium-failure
          path: |
            ui/control-plane/test-results/
          if-no-files-found: ignore
          retention-days: 5

  platform-image:
    name: Container Image (Build + Smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build platform image
        env:
          PLATFORM_IMAGE: ai-model-serving-platform:ci-${{ github.sha }}
          PLATFORM_BUILD_PLATFORM: linux/amd64
        run: make build-image
      - name: Check image HTTP entrypoint
        env:
          PLATFORM_IMAGE: ai-model-serving-platform:ci-${{ github.sha }}
          PLATFORM_BUILD_PLATFORM: linux/amd64
        run: make image-smoke

  quality-lock-candidates:
    name: Generate temporary quality lock candidates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ui/control-plane/.nvmrc
      - name: Pin npm
        run: npm install --global "npm@$(node -p "require('./ui/control-plane/package.json').engines.npm")"
      - name: Generate npm candidate
        run: |
          npm --prefix scripts/quality install --package-lock-only --ignore-scripts --no-audit --no-fund
          python3 - <<'PY'
          import base64, hashlib
          from pathlib import Path
          data = Path("scripts/quality/package-lock.json").read_bytes()
          encoded = base64.b64encode(data).decode("ascii")
          for i in range(0, len(encoded), 3500):
              print(f"QUALITY_LOCK:NPM:{i//3500:04d}:{encoded[i:i+3500]}")
          print(f"QUALITY_LOCK_SHA:NPM:{hashlib.sha256(data).hexdigest()}")
          PY
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          resolution-strategy: highest
      - name: Generate uv candidate
        run: |
          uv lock
          python3 - <<'PY'
          import base64, hashlib
          from pathlib import Path
          data = Path("uv.lock").read_bytes()
          encoded = base64.b64encode(data).decode("ascii")
          for i in range(0, len(encoded), 3500):
              print(f"QUALITY_LOCK:UV:{i//3500:04d}:{encoded[i:i+3500]}")
          print(f"QUALITY_LOCK_SHA:UV:{hashlib.sha256(data).hexdigest()}")
          PY

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [python, frontend, browser, platform-image]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["JOB_RESULTS"])
          failures = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          sys.exit(1 if failures else 0)
          PY
