# PR #236 소스 정리에 대응해 체크인 Console 생성물만 갱신하는 한시적 작업.
# 갱신 후 이 파일은 브랜치에서 삭제한다. Runtime 자격 증명은 사용하지 않는다.
name: PR 236 Console asset refresh

on:
  push:
    branches:
      - fix/main-gate-observation-gpu-reservation
    paths:
      - .github/workflows/pr-236-console-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/main-gate-observation-gpu-reservation
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: ui/control-plane/package-lock.json
      - name: Regenerate the canonical Console build
        run: |
          npm install --global npm@11.19.0
          make console-build
      - name: Commit only generated Console assets to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/ai_model_serving/static/control-plane
          if ! git diff --cached --quiet; then
            git commit -m 'build(console): 미사용 코드 정리 후 생성 자산을 동기화한다'
            git push origin HEAD:refs/heads/fix/main-gate-observation-gpu-reservation
          fi
