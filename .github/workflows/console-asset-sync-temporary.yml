name: Temporary Console asset synchronization
on:
  push:
    branches: [refactor/platform-maintainability-stabilization]

permissions:
  contents: write

jobs:
  sync-console:
    if: startsWith(github.event.head_commit.message, 'test(playground): 도구 결과의 사용자 제출 경계를 검증한다')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ui/control-plane/.nvmrc
          cache: npm
          cache-dependency-path: ui/control-plane/package-lock.json
      - name: Rebuild checked-in Console from this exact source
        run: |
          npm install --global "npm@$(node -p "require('./ui/control-plane/package.json').engines.npm")"
          make console-build
          git add -A src/ai_model_serving/static/control-plane
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Console assets already match source."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(console): 분리된 Playground의 생성 자산을 소스와 일치시킨다'
          git push origin "HEAD:${GITHUB_REF_NAME}"
