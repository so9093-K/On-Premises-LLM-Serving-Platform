name: Temporary regenerate Console artifacts for PR 264
on:
  push:
    branches: [refactor/port-namespace-policy-9600]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ui/control-plane/.nvmrc
          cache: npm
          cache-dependency-path: ui/control-plane/package-lock.json
      - name: Build checked-in Console artifacts
        run: |
          npm install --global "npm@$(node -p "require('./ui/control-plane/package.json').engines.npm")"
          npm --prefix ui/control-plane ci
          npm --prefix ui/control-plane run build
      - name: Commit only generated Console artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/ai_model_serving/static/control-plane
          if git diff --cached --quiet; then
            echo "Generated assets already current"
          else
            git commit -m "build(console): 96xx API 예제에 맞는 배포 산출물을 갱신한다"
            git push origin "HEAD:refs/heads/refactor/port-namespace-policy-9600"
          fi
