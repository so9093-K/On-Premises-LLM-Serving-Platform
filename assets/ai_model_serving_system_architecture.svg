<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">온프레미스 LLM 서빙 플랫폼</title>
<desc id="desc">사용자와 애플리케이션이 OpenAI-compatible API를 통해 API Gateway에 연결되고, 대화·멀티모달, 임베딩·검색, 위험 신호 탐지 기능과 운영 제어, 모니터링, Linux/NVIDIA 및 Apple Silicon 실행 환경을 사용하는 플랫폼 구성도</desc>
<defs>
<style>
.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","NanumSquare","UnDotum",sans-serif;fill:#111827}.title{font-size:60px;font-weight:800;letter-spacing:-2px}.subtitle{font-size:26px;fill:#334155}.h1{font-size:34px;font-weight:800}.h2{font-size:25px;font-weight:800}.h3{font-size:20px;font-weight:750}.body{font-size:20px;fill:#334155}.small{font-size:17px;fill:#475569}.label{font-size:18px;font-weight:650}.line{stroke:#475569;stroke-width:2;fill:none}.thin{stroke:#cbd5e1;stroke-width:1.2;fill:none}.panel{fill:#fbfcfd;stroke:#94a3b8;stroke-width:1.3}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}.icon{fill:#475569}.icon2{fill:#334155}
</style>
