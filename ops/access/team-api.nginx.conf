# Tailscale Serve만 이 Loopback Listener에 연결한다. 임의의 Host bind 금지.
# 이 파일은 /etc/nginx/conf.d/ 같은 Nginx http 블록 아래에 설치한다.
server {
    listen 127.0.0.1:9680;
    server_name _;
    server_tokens off;
    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:9600;
    proxy_set_header Connection "";
    # 외부가 제공한 네트워크·사용자 Identity Header를 Gateway에 신뢰 정보로 전달하지 않는다.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Tailscale-User-Login "";
    proxy_set_header X-Tailscale-User-Name "";
    proxy_set_header X-Tailscale-User-Profile-Pic "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    add_header X-Content-Type-Options nosniff always;

    # Exact location + 원래 URI 검사 + 정규화된 고정 upstream URL 사용:
    # percent-encoding, suffix 및 path traversal이 허용 API로 우회되지 않아야 한다.
    location = /v1/models {
        if ($request_uri !~ "^/v1/models(?:\?.*)?$") { return 404; }
        if ($request_method != GET) { return 405; }
        proxy_pass http://127.0.0.1:9600/v1/models;
    }
    location = /v1/chat/completions {
        if ($request_uri !~ "^/v1/chat/completions(?:\?.*)?$") { return 404; }
        if ($request_method != POST) { return 405; }
        proxy_pass http://127.0.0.1:9600/v1/chat/completions;
    }
    location = /v1/responses {
        if ($request_uri !~ "^/v1/responses(?:\?.*)?$") { return 404; }
        if ($request_method != POST) { return 405; }
        proxy_pass http://127.0.0.1:9600/v1/responses;
    }
    location = /v1/embeddings {
        if ($request_uri !~ "^/v1/embeddings(?:\?.*)?$") { return 404; }
        if ($request_method != POST) { return 405; }
        proxy_pass http://127.0.0.1:9600/v1/embeddings;
    }
    location / { return 404; }
}
