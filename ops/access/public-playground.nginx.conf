# 외부 HTTPS 진입점은 이 사용자 전용 Loopback Listener만 사용한다.
# 이 파일은 /etc/nginx/conf.d/ 같은 Nginx http 블록 아래에 설치한다.
# 모든 접속자가 공유하는 상한이다. 사용자별 할당량이나 IP별 제한이 아니다.
limit_req_zone $server_name zone=llm_public_requests:1m rate=10r/s;
limit_conn_zone $server_name zone=llm_public_inference:1m;

server {
    listen 127.0.0.1:9480;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    limit_req zone=llm_public_requests burst=40 nodelay;
    limit_req_status 429;
    limit_conn_status 429;
    client_body_timeout 30s;
    send_timeout 300s;
    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:9400;
    proxy_set_header Connection "";
    # 외부가 제공한 네트워크·사용자 Identity Header를 Gateway에 신뢰 정보로 전달하지 않는다.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Tailscale-User-Login "";
    proxy_set_header X-Tailscale-User-Name "";
    proxy_set_header X-Tailscale-User-Profile-Pic "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    add_header X-Content-Type-Options nosniff always;

    # Exact location + 원래 URI 검사 + 정규화된 고정 upstream URL 사용:
    # percent-encoding, suffix 및 path traversal이 허용 API로 우회되지 않아야 한다.
    location = /v1/models {
        if ($request_uri !~ "^/v1/models(?:\?.*)?$") { return 404; }
        if ($request_method != GET) { return 405; }
        proxy_pass http://127.0.0.1:9400/v1/models;
    }
    location = /v1/chat/completions {
        if ($request_uri !~ "^/v1/chat/completions(?:\?.*)?$") { return 404; }
        if ($request_method != POST) { return 405; }
        limit_conn llm_public_inference 4;
        proxy_pass http://127.0.0.1:9400/v1/chat/completions;
    }
    location = /v1/responses {
        if ($request_uri !~ "^/v1/responses(?:\?.*)?$") { return 404; }
        if ($request_method != POST) { return 405; }
        limit_conn llm_public_inference 4;
        proxy_pass http://127.0.0.1:9400/v1/responses;
    }
    location = /v1/embeddings {
        if ($request_uri !~ "^/v1/embeddings(?:\?.*)?$") { return 404; }
        if ($request_method != POST) { return 405; }
        limit_conn llm_public_inference 4;
        proxy_pass http://127.0.0.1:9400/v1/embeddings;
    }
    location = /v1/retrieval/rerank {
        if ($request_uri !~ "^/v1/retrieval/rerank(?:\?.*)?$") { return 404; }
        if ($request_method != POST) { return 405; }
        limit_conn llm_public_inference 4;
        proxy_pass http://127.0.0.1:9400/v1/retrieval/rerank;
    }
    location = /v1/retrieval/score {
        if ($request_uri !~ "^/v1/retrieval/score(?:\?.*)?$") { return 404; }
        if ($request_method != POST) { return 405; }
        limit_conn llm_public_inference 4;
        proxy_pass http://127.0.0.1:9400/v1/retrieval/score;
    }
    location = /v1/risk/assessments {
        if ($request_uri !~ "^/v1/risk/assessments(?:\?.*)?$") { return 404; }
        if ($request_method != POST) { return 405; }
        limit_conn llm_public_inference 4;
        proxy_pass http://127.0.0.1:9400/v1/risk/assessments;
    }
    location = /v1/risk/detectors/prompt/assessments {
        if ($request_uri !~ "^/v1/risk/detectors/prompt/assessments(?:\?.*)?$") { return 404; }
        if ($request_method != POST) { return 405; }
        limit_conn llm_public_inference 4;
        proxy_pass http://127.0.0.1:9400/v1/risk/detectors/prompt/assessments;
    }
    location = /v1/risk/detectors/pii/assessments {
        if ($request_uri !~ "^/v1/risk/detectors/pii/assessments(?:\?.*)?$") { return 404; }
        if ($request_method != POST) { return 405; }
        limit_conn llm_public_inference 4;
        proxy_pass http://127.0.0.1:9400/v1/risk/detectors/pii/assessments;
    }
    location = /v1/risk/detectors/secret/assessments {
        if ($request_uri !~ "^/v1/risk/detectors/secret/assessments(?:\?.*)?$") { return 404; }
        if ($request_method != POST) { return 405; }
        limit_conn llm_public_inference 4;
        proxy_pass http://127.0.0.1:9400/v1/risk/detectors/secret/assessments;
    }
    location = /playground/ {
        if ($request_uri !~ "^/playground/(?:\?.*)?$") { return 404; }
        if ($request_method != GET) { return 405; }
        proxy_pass http://127.0.0.1:9400/playground/;
    }
    location = /playground/chat {
        if ($request_uri !~ "^/playground/chat(?:\?.*)?$") { return 404; }
        if ($request_method != GET) { return 405; }
        proxy_pass http://127.0.0.1:9400/playground/chat;
    }
    location = /playground/embeddings {
        if ($request_uri !~ "^/playground/embeddings(?:\?.*)?$") { return 404; }
        if ($request_method != GET) { return 405; }
        proxy_pass http://127.0.0.1:9400/playground/embeddings;
    }
    location = /playground/risk {
        if ($request_uri !~ "^/playground/risk(?:\?.*)?$") { return 404; }
        if ($request_method != GET) { return 405; }
        proxy_pass http://127.0.0.1:9400/playground/risk;
    }
    location = /playground/config.json {
        if ($request_uri !~ "^/playground/config[.]json(?:\?.*)?$") { return 404; }
        if ($request_method != GET) { return 405; }
        proxy_pass http://127.0.0.1:9400/playground/config.json;
    }
    location = / { return 307 /playground/; }
    location = /playground { return 307 /playground/; }
    location ^~ /playground/assets/ {
        if ($request_uri !~ "^/playground/assets/[A-Za-z0-9_.-]+(?:\?.*)?$") { return 404; }
        if ($request_method != GET) { return 405; }
        proxy_pass http://127.0.0.1:9400;
    }
    location / { return 404; }
}
