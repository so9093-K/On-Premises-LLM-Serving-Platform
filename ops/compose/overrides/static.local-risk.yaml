# Static targets share local in-process Risk detectors independent of Main runtime backend.
# Prompt Injection detection is a separate model-backed capability and is intentionally absent here.
services:
  gateway:
    depends_on:
      risk-signal-service:
        condition: service_healthy

  risk-signal-service:
    image: ${PLATFORM_IMAGE:?Set PLATFORM_IMAGE to a tested platform image tag}
    restart: unless-stopped
    command:
      - python
      - -m
      - uvicorn
      - ai_model_serving.apps.risk_signal_service_asgi:app
      - --host
      - 0.0.0.0
      - --port
      - "9405"
    env_file: ${RISK_SIGNAL_SERVICE_RUNTIME_ENV_FILE:?Use make up|down}
    environment:
      APP_CONFIG_ROOT: /app
      PYTHONPATH: /app/src
      REQUEST_EVENT_LOG_DIR: /var/log/ai-model-serving
    expose:
      - "9405"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:9405/health')"
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - ../../.runtime/request-events:/var/log/ai-model-serving
      - ../../configs:/app/configs:ro
      - ../../specs/schemas:/app/specs/schemas:ro
