# Core는 모델의 이미지·캐시·준비 상태를 기동 의존성으로 갖지 않는다.
services:
  gateway:
    environment:
      RUNTIME_CONTROLLER_URL: http://runtime-controller:8080
      MAIN_MODEL_MAX_CONCURRENCY: '1'
      MAIN_MODEL_BASE_URL: http://main-llm-vllm:9401/v1

  main-llm-vllm:
    image: ${LLAMA_CPP_IMAGE:?Use the pinned CPU runtime image}
    command: ${CPU_MAIN_COMMAND:?Use make up}
    restart: unless-stopped
    mem_limit: ${CPU_MEMORY_LIMIT_BYTES:?Use make up}
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    volumes:
      - ../../.runtime/cpu-models:/models:ro
      - ${HF_CACHE_DIR:-./model_cache/huggingface}:/root/.cache/huggingface:ro
      - ../../configs:/app/configs:ro
      - main-vllm-cache:/root/.cache/vllm
    expose: ['9401']
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9401/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3

  runtime-controller:
    image: ${PLATFORM_IMAGE:?Use make up}
    user: 0:0
    restart: unless-stopped
    command: [python, -m, uvicorn, ai_model_serving.apps.adaptive_controller:create_adaptive_controller_app, --factory, --host, 0.0.0.0, --port, '8080']
    env_file: ${ADAPTIVE_CONTROLLER_ENV_FILE:?Use make up}
    environment:
      APP_CONFIG_ROOT: /app
      PLATFORM_STATE_DIR: /var/lib/ai-model-serving
      DOCKER_SOCKET: /var/run/docker.sock
      COMPOSE_PROJECT: ${STATIC_COMPOSE_PROJECT_NAME:-ai-model-serving-static}
      GATEWAY_INTERNAL_URL: http://gateway:9400
      HF_HOME: /root/.cache/huggingface
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../.runtime/main-model:/var/lib/ai-model-serving
      - ../../.runtime/cpu-models:/models
      - ${HF_CACHE_DIR:-./model_cache/huggingface}:/root/.cache/huggingface
      - ../../configs:/app/configs:ro
    expose: ['8080']
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3

  resource-observer:
    image: ${PLATFORM_IMAGE:?Use make up}
    profiles: [gpu-observation]
    restart: unless-stopped
    command: [python, -m, uvicorn, ai_model_serving.apps.host_resource_observer:create_host_resource_observer_app, --factory, --host, 0.0.0.0, --port, '8081']
    env_file: ${HOST_RESOURCE_OBSERVER_ENV_FILE:?Use make up}
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility
    gpus: all
    expose: ['8081']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    pids_limit: 128
    security_opt: [no-new-privileges:true]

volumes:
  main-vllm-cache:
    labels:
      ai_model_serving.checkout: ${COMPOSE_CHECKOUT_ROOT:-}
