# 운영자가 허용한 CPU GGUF만 제공한다. 컨테이너 포트를 host에 공개하지 않는다.
services:
  cpu-main:
    image: ${LLAMA_CPP_IMAGE:?Use pinned official llama.cpp server digest}
    restart: unless-stopped
    command: ${CPU_MAIN_COMMAND:?Use make up}
    expose:
      - "8080"
    mem_limit: ${CPU_MEMORY_LIMIT_BYTES:?Use make up}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../../.runtime/cpu-models:/models:ro
