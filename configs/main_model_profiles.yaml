# Main Model의 실제 부팅·전환 계약이다. 과거 검증 기록은
# docs/resources/main_model_profile_validation_history.md에 별도로 보존한다.
version: 1
# 외부 API가 사용하는 고정 model 이름이다.
public_model: local-main
# MAIN_MODEL_BOOT_PROFILE이 비어 있을 때 시작할 profile이다.
default_profile: gemma4-12b-unified-fp8
# Runtime Controller가 전환·상태 확인에 사용하는 공통 runtime 연결 정보다.
runtime:
  compose_service: main-llm-vllm
  container_port: 9401
  models_path: /v1/models
  chat_path: /v1/chat/completions
  # profile별 image가 없을 때 쓰는 unified runtime pin. CI/CD는 registry digest,
  # local make build는 Docker image ID로 .env를 갱신하므로 선택 가능한 profile이
  # mutable tag나 과거 고정 image를 상속하지 않는다.
  image: ${VLLM_IMAGE}
  drain_timeout_seconds: 30
  startup_timeout_seconds: 600
  stop_timeout_seconds: 30
# Admin API로 선택할 수 있는 main runtime 후보들이다.
profiles:
  gemma4-26b-a4b-fp8:
    display_name: Gemma 4 26B A4B FP8
    model_id: RedHatAI/gemma-4-26B-A4B-it-FP8-Dynamic
    revision: 8edbb9269ec9c3faad538ee1208a07eb46051f34
    served_model_name: local-main
    compatibility:
      # 현재 deployment/runtime 조합에서 기술적으로 호환되는 profile이다.
      status: compatible
    qualification:
      # 실제 장비 검증을 마친 profile만 별도 확인 없이 전환한다.
      status: verified
    capabilities:
      # Gateway 허용 입력이자 switch-time media boot canary의 단일 source of truth다 --
      # 여기 있는 modality마다 전환 시 실제 canary가 실행된다.
      deployed_input: [text, image]
    # 컨테이너 재생성 시 그대로 적용할 vLLM 실행 인자다.
    command:
    - --host
    - 0.0.0.0
    - --port
    - "9401"
    - --max-model-len
    - "20000"
    - --max-num-seqs
    - "1"
    - --max-num-batched-tokens
    - "20000"
    - --optimization-level
    - "3"
    - --gpu-memory-utilization
    - "0.76"
    - --tensor-parallel-size
    - "1"
    - --dtype
    - auto
    - --trust-remote-code
    # Gemma 4의 vision token budget이다. 허용값 70/140/280/560/1120 중 최대값을
    # 세 Gemma profile에 공통 적용한다. Gateway의 pixel 상한은 decode 보호용 별도 계약이다.
    - --mm-processor-kwargs
    - &gemma4_max_soft_tokens '{"max_soft_tokens": 1120}'
    - --enable-prefix-caching
    - --prefix-caching-hash-algo
    - sha256_cbor
    - --enable-auto-tool-choice
    - --tool-call-parser
    - gemma4
    - --reasoning-parser
    - gemma4
    # 응답 형식에 영향을 주는 Gemma 4 prompt template이다.
    - --chat-template
    - /app/configs/gemma4_chat_template.jinja
    - --structured-outputs-config
    # Gemma4 reasoning 종료(<channel|>) 뒤 최종 답변에만 JSON schema grammar를 적용한다.
    # vLLM 기본 경로이며, thinking 채널 토큰을 JSON grammar로 제한하지 않는다.
    - '{"backend":"xgrammar","disable_any_whitespace":true,"enable_in_reasoning":false}'
    # Profile 전환과 함께 Gateway가 적용할 모델별 API 계약이다. 공통 연결·timeout·
    # admission만 model_serving.yaml에 남기며, 요청 한도·기능은 여기서 결정한다.
    gateway_policy: &gemma4_gateway_policy
      max_output_tokens: 13000
      request_limits: &gemma4_text_image_limits
        max_model_len: 20000
        input_modalities: [text, image]
        max_image_inputs: 1
        allowed_image_url_schemes: [data]
        max_image_bytes: 25000000
        max_image_pixels: 12845056
        allowed_image_mime_types: [image/jpeg, image/png, image/webp, image/avif, image/jp2, image/gif, image/bmp, image/tiff, image/x-tiff]
      request_parameter_policy:
        allow_unlisted_parameters: false
        supported_parameters: [stream, stream_options, temperature, max_tokens, top_p, top_k, min_p, presence_penalty, frequency_penalty, repetition_penalty, stop, seed, n, tools, tool_choice, parallel_tool_calls, reasoning, response_format, logprobs, top_logprobs, logit_bias, user]
        drop_upstream_parameters: [user]
        max_n: 1
        tool_calling:
          enabled: true
          max_tools: 64
          allow_parallel_tool_calls: false
          tool_choice:
            # vLLM 0.25.1 + gemma4 parser에서 required/named forced choice가
            # live canary의 OpenAI tool-call 계약을 안정적으로 만족하지 못했다.
            # 0.30.0으로 엔진을 올린 뒤에도 강제 choice의 동등성 canary가 없으므로
            # auto/none만 공개하고 forced mode는 다시 실측하기 전까지 fail-closed한다.
            allowed: [auto, none]
            allow_named: false
        reasoning:
          enabled: true
          default: false
          mode: request_opt_in
          responses_effort: medium
          upstream_chat_template_kwargs:
            enable_thinking: true
        response_format:
          enabled: true
          types: [text, json_object, json_schema]
          json_object:
            require_json_instruction: true
          json_schema:
            enabled: true
            require_root_object: true
            require_additional_properties_false: true
            strict:
              allowed: true
              require_true: false
            max_schema_bytes: 16384
            max_depth: 8
            max_total_properties: 64
            max_properties_per_object: 32
            max_required: 64
            max_enum_values: 128
            max_enum_string_length: 256
            max_property_name_length: 64
            max_total_schema_string_length: 32768
            disallowed_keywords: [allOf, not, if, then, else, dependentRequired, dependentSchemas, patternProperties, $dynamicRef, $recursiveRef, $dynamicAnchor, $recursiveAnchor, $id, $anchor]
            root_disallowed_keywords: [anyOf]
        logprobs:
          enabled: true
          default: false
          allow_stream: true
        top_logprobs:
          min: 0
          max: 10
          requires_logprobs: true
        logit_bias:
          enabled: true
          max_entries: 256
          min_bias: -100
          max_bias: 100
          token_id_min: 0
          token_id_semantics: served_model_tokenizer
  gemma4-12b-unified-fp8:
    display_name: Gemma 4 12B Unified FP8
    model_id: RedHatAI/gemma-4-12B-it-FP8-Dynamic
    revision: 67e53491df7a281623fa740de61307d5c542b7f4
    served_model_name: local-main
    # CI/deploy가 derived image digest를 주입한다.
    image: ${MAIN_MODEL_VLLM_IMAGE_OVERRIDE}
    compatibility:
      # 현재 deployment/runtime 조합에서 기술적으로 호환되는 profile이다.
      status: compatible
    qualification:
      # 실제 장비 검증을 마친 profile만 별도 확인 없이 전환한다.
      status: verified
    capabilities:
      # Gateway 허용 입력이자 switch-time media boot canary의 단일 source of truth다 --
      # 여기 있는 modality마다 전환 시 실제 canary가 실행된다.
      deployed_input: [text, image, audio, video]
    # 컨테이너 재생성 시 그대로 적용할 vLLM 실행 인자다.
    command:
    - --host
    - 0.0.0.0
    - --port
    - "9401"
    - --max-model-len
    - "50000"
    - --max-num-seqs
    - "3"
    - --max-num-batched-tokens
    - "50000"
    - --optimization-level
    - "3"
    # host별 VRAM 비율은 MAIN_MODEL_GPU_MEMORY_UTILIZATION으로만 바꾼다.
    - --gpu-memory-utilization
    - "0.76"
    - --tensor-parallel-size
    - "1"
    - --dtype
    - auto
    - --trust-remote-code
    - --mm-processor-kwargs
    - *gemma4_max_soft_tokens
    - --enable-prefix-caching
    - --prefix-caching-hash-algo
    - sha256_cbor
    - --enable-auto-tool-choice
    - --tool-call-parser
    - gemma4
    - --reasoning-parser
    - gemma4
    # 응답 형식에 영향을 주는 Gemma 4 prompt template이다.
    - --chat-template
    - /app/configs/gemma4_chat_template.jinja
    - --structured-outputs-config
    # 12B와 동일하게 reasoning 종료 뒤 최종 답변에만 JSON schema grammar를 적용한다.
    - '{"backend":"xgrammar","disable_any_whitespace":true,"enable_in_reasoning":false}'
    # 26B와 공통인 API 기능은 재사용하되, 이 Profile이 실제 배포하는 media 한도만 확장한다.
    gateway_policy:
      <<: *gemma4_gateway_policy
      request_limits:
        <<: *gemma4_text_image_limits
        max_model_len: 50000
        input_modalities: [text, image, audio, video]
        # audio/video는 이 Profile이 실제로 배포할 때만 허용된다.
        max_audio_inputs: 1
        allowed_audio_formats: [wav, mp3, flac, ogg, m4a, mp4, aac]
        max_audio_bytes: 25000000
        max_video_inputs: 1
        allowed_video_url_schemes: [data]
        allowed_video_mime_types: [video/mp4, video/webm, video/x-matroska, video/quicktime, video/jpeg, video/x-msvideo, video/avi, video/gif]
        max_video_bytes: 50000000
        max_video_frames: 60
        max_video_frame_pixels: 12845056
        max_video_duration_seconds: 60
  gemma4-e4b-it:
    display_name: Gemma 4 E4B IT
    model_id: google/gemma-4-E4B-it
    revision: ee0ef6023621cff504d758262d4e04895a5af4a2
    served_model_name: local-main
    image: ${MAIN_MODEL_VLLM_IMAGE_OVERRIDE}
    compatibility:
      # 전환·Gateway 계약·streaming reasoning·structured output·tool call·media 4종을
      # 배포본에서 실측했고, 12B/26B 회귀와 리소스 한도 확정(65K context, seqs=4,
      # 15,000 출력)까지 끝냈다. 전환 실패 rollback은 세 profile이 공유하는 플랫폼
      # 메커니즘이라 E4B 고유 조건에서 제외했다(12B/26B도 검증한 적 없음).
      status: compatible
    qualification:
      status: verified
    capabilities:
      # 이 집합은 Gateway 허용 입력과 switch-time media canary의 단일 기준이다.
      # 각 경로는 동일 immutable image의 직접 vLLM canary를 통과했다.
      deployed_input: [text, image, audio, video]
    command:
    - --host
    - 0.0.0.0
    - --port
    - "9401"
    # E4B의 128K 명세를 운영 한도로 쓰지 않는다. 아래는 같은 GPU에서 세 profile을
    # 실측 대조해 정한 값이다.
    #
    #   profile  weights     KV 메모리   KV token   자기 context 기준 동시성
    #   E4B      15.47 GiB   18.88 GiB   352,943    21.54x @ 16,384
    #   12B      12.75 GiB   17.22 GiB    53,722     1.07x @ 50,000
    #   26B      25.80 GiB    6.60 GiB    31,438     1.57x @ 20,000
    #
    # E4B는 비슷한 KV 메모리에서 token이 6.6배 나온다. 이전 값(16,384/seqs=1)은 그
    # 352,943 token 중 4.6%만 쓰면서 동시 요청을 직렬화시켰다(4건 3.0/6.0/8.9/11.9초).
    # context는 default profile인 12B와 같은 50,000에 맞춘다. 12B는 그 context에서
    # KV가 1.07x라 max_num_seqs=3이 이미 초과 구독인 반면, E4B는 50,000 x 4 = 200,000으로
    # 1.76x 여유가 남는다. batched도 12B가 같은 GPU에서 검증한 50,000을 쓴다.
    # max_model_len만 65,000(= 입력 50,000 + 출력 15,000)으로 올리고 batched는 50,000에
    # 둔다. chunked prefill이 켜져 있어(엔진 로그 확인) 긴 prompt는 50,000 chunk로 쪼개
    # 처리되므로, 활성 메모리는 batched가 정하고 max_model_len은 시퀀스당 KV 상한만 정한다.
    # 지금까지 KV 부족 사고는 전부 batched를 같이 올려서 났다 — 오늘 16,384->50,000에
    # KV가 18.88->15.03 GiB로 줄었고, 12B는 58,192로 올렸다가 boot 실패로 롤백됐다(아래 주석).
    # batched를 고정하면 KV pool 281,169 token이 유지될 것으로 보나, boot 재측정 전에는
    # 확정이 아니다. 4 x 65,000 = 260,000으로 pool의 92%라 네 요청이 동시에 65K를 모두
    # 채우면 preemption이 날 수 있다(장애가 아니라 recompute로 인한 지연). 실측 KV 사용률은
    # 0.4% 수준이었다. `batched >= max_model_len` 제약은 pooling 런타임에만 적용된다.
    - --max-model-len
    - "65000"
    - --max-num-seqs
    - "4"
    - --max-num-batched-tokens
    - "50000"
    # KV token은 남지만 GPU 잔여가 5 GiB대라 이 값은 올리지 않는다.
    - --gpu-memory-utilization
    - "0.76"
    - --tensor-parallel-size
    - "1"
    - --dtype
    - auto
    - --trust-remote-code
    - --mm-processor-kwargs
    - *gemma4_max_soft_tokens
    # E4B도 Gemma4의 native tool/reasoning channel을 사용한다. 아래 parser와 template는
    # 동일 image·revision의 일회성 runtime에서 tool_calls 및 reasoning 분리를 확인했다.
    - --enable-auto-tool-choice
    - --tool-call-parser
    - gemma4
    - --reasoning-parser
    - gemma4
    - --chat-template
    - /app/configs/gemma4_chat_template.jinja
    - --structured-outputs-config
    # 26B·12B와 같은 값이다. 이 프로필에만 빠져 있어서 ADR-0016이 고친 xgrammar
    # any_whitespace stuck state가 E4B에서만 그대로 재현됐다 -- 자유 string 필드가
    # 있는 json_schema 요청이 값 생성 뒤 `\n  `만 max_tokens까지 반복했다.
    - '{"backend":"xgrammar","disable_any_whitespace":true,"enable_in_reasoning":false}'
    # Reference policy가 맞지 않는 host에서만 쓰는 명시적 resource-policy override다.
    # 위 command는 RTX 6000 Ada 48GB에서 실측한 reference policy이고, 새 GPU 제품명이
    # 보였다는 이유만으로 variant를 추가하지 않는다. 실제 자원 조건 때문에 다른 knob가
    # 필요할 때만 덮어쓴다. model/revision/capabilities/gateway 계약은 바꿀 수 없다.
    #
    # 왜 필요한가: GPU budget은 VRAM 총량 대비 *비율*로 선언되는데, 그 비율이 덮어야
    # 하는 것(weight, CUDA context, prefill activation workspace, reserve)은 *절대량*이다.
    # 그래서 48GB에서 정한 비율은 24GB로 그대로 이전되지 않는다.
    resource_variants:
      rtx4090-24gb:
        display_name: NVIDIA GeForce RTX 4090 24GB
        # 2026-09-19 RTX 4090(24,564 MiB, driver 580.178.04, vLLM 0.25.1) 실측.
        # weight 15.23 GiB는 고정이므로 24GB에서 남는 예산은 prefill workspace와 KV가
        # 나눠 갖는다. batched를 키우면 workspace가 KV를 그대로 잠식한다:
        #
        #   batched   KV 가용     KV token   65,000 기동
        #    4,096    2.12 GiB    117,849    성공 (여유 29%)
        #    8,192    1.69 GiB     82,686    성공 (여유 3%)
        #   16,384    0.78 GiB          -    실패
        #   50,000         -           -     실패 (최초 OOM 보고)
        #
        # vLLM은 65,000 token 시퀀스 하나를 받기 위해 최소 1.64 GiB KV를 요구한다.
        # 8,192는 여유가 3%뿐이라 운영 계약으로 쓰지 않는다. 4,096을 선택한다.
        #
        # max_model_len 65,000, max_num_seqs 4, gpu_memory_utilization 0.76은
        # 48GB 값 그대로 기동·동작한다. seqs는 boot 메모리에 거의 영향이 없고
        # (4,096에서 seqs 1과 4의 KV가 동일한 117,849), 24GB에서 실제로 달라지는
        # 값은 batched 하나뿐이다. chunked prefill이 긴 prompt를 4,096 chunk로
        # 쪼개므로 65,000 context는 그대로 서빙된다.
        #
        # 부하 검증(동일 image·revision, 격리 runtime): 단일 47,209 token 6.0초,
        # 4-way 동시 27,700 token x 4(KV pool 포화) 전건 성공, 4-way 동시
        # 47,300 token x 4(1.6배 초과 구독) 전건 성공. OOM 0건, preemption 0건,
        # GPU peak 19,781 MiB / 24,564 MiB. 초과 구독은 실패가 아니라 queue
        # 대기로 나타났다(26초 -> 56초).
        #
        # 범위: Main Model 격리 실측이다. 이 host에서 embedding 2종과 risk
        # detector를 함께 상주시키는 구성은 아직 검증하지 않았다.
        max_num_batched_tokens: 4096
    gateway_policy:
      # 12B가 13000을 고른 방식(단일 스트림 52 tok/s로 300초 안에 250초)을 E4B 실측으로
      # 다시 계산한 값이다. E4B는 단일 79~82 tok/s, 동시 2건에서도 73 tok/s로 저하가 8%뿐이라
      # 15,000 token은 73 tok/s 기준 약 205초다. 자연 종료 최댓값이 12,616 token(상한의
      # 97%)까지 관측돼 13000은 여유가 3%밖에 없었다.
      #
      # 전제: MAIN_MODEL_TIMEOUT_SECONDS >= 400 (그리고 REQUEST_TIMEOUT_SECONDS는 그 이상).
      # 배포된 .env의 운영자 값이며 sync-env가 덮지 않는다. 300초로 남아 있어도 단일·2건
      # 경로는 205초라 들어가지만, 4-way 동시 긴 생성이나 reasoning이 붙으면 여유가 없다.
      #
      max_output_tokens: 15000
      request_limits:
        # command와 같은 값을 유지한다(engine 한도와 admission이 갈라지지 않게 하는 계약).
        # Gateway는 tokenizer를 복제하지 않고 출력 상한만 선제 검사한다. 실제 prompt와
        # 요청 출력의 합이 65,000을 넘는지는 vLLM이 정확한 전처리 뒤 거부하며, 해당
        # 비재시도 4xx는 Gateway의 422 VALIDATION_ERROR로 전달한다.
        max_model_len: 65000
        input_modalities: [text, image, audio, video]
        # E4B 고유 최대치를 추정해 열지 않는다. 기존 unified decode 경계의 보수적인
        # transport 한도를 시작점으로 쓰고, media 실측 뒤 조정한다.
        max_image_inputs: 1
        allowed_image_url_schemes: [data]
        max_image_bytes: 25000000
        max_image_pixels: 12845056
        allowed_image_mime_types: [image/jpeg, image/png, image/webp, image/avif, image/jp2, image/gif, image/bmp, image/tiff, image/x-tiff]
        max_audio_inputs: 1
        allowed_audio_formats: [wav, mp3, flac, ogg, m4a, mp4, aac]
        max_audio_bytes: 25000000
        max_video_inputs: 1
        allowed_video_url_schemes: [data]
        allowed_video_mime_types: [video/mp4, video/webm, video/x-matroska, video/quicktime, video/jpeg, video/x-msvideo, video/avi, video/gif]
        max_video_bytes: 50000000
        max_video_frames: 60
        max_video_frame_pixels: 12845056
        max_video_duration_seconds: 60
      # 동일 image·revision의 parser runtime에서 구조화된 tool_calls와 reasoning 분리를
      # 확인했다. 템플릿 경로와 parser 이름은 command와 같은 단일 계약으로 유지한다.
      request_parameter_policy:
        allow_unlisted_parameters: false
        supported_parameters: [stream, stream_options, temperature, max_tokens, top_p, top_k, min_p, presence_penalty, frequency_penalty, repetition_penalty, stop, seed, n, tools, tool_choice, parallel_tool_calls, reasoning, response_format, logprobs, top_logprobs, logit_bias, user]
        drop_upstream_parameters: [user]
        max_n: 1
        tool_calling:
          enabled: true
          max_tools: 64
          allow_parallel_tool_calls: false
          tool_choice:
            # vLLM 0.25.1 + gemma4 parser에서 required/named forced choice가
            # live canary의 OpenAI tool-call 계약을 안정적으로 만족하지 못했다.
            # 0.30.0으로 엔진을 올린 뒤에도 강제 choice의 동등성 canary가 없으므로
            # auto/none만 공개하고 forced mode는 다시 실측하기 전까지 fail-closed한다.
            allowed: [auto, none]
            allow_named: false
        reasoning:
          enabled: true
          default: false
          mode: request_opt_in
          responses_effort: medium
          upstream_chat_template_kwargs:
            enable_thinking: true
        response_format:
          enabled: true
          types: [text, json_object, json_schema]
          json_object:
            require_json_instruction: true
          json_schema:
            enabled: true
            require_root_object: true
            require_additional_properties_false: true
            strict:
              allowed: true
              require_true: false
            max_schema_bytes: 16384
            max_depth: 8
            max_total_properties: 64
            max_properties_per_object: 32
            max_required: 64
            max_enum_values: 128
            max_enum_string_length: 256
            max_property_name_length: 64
            max_total_schema_string_length: 32768
            disallowed_keywords: [allOf, not, if, then, else, dependentRequired, dependentSchemas, patternProperties, $dynamicRef, $recursiveRef, $dynamicAnchor, $recursiveAnchor, $id, $anchor]
            root_disallowed_keywords: [anyOf]
        logprobs:
          enabled: true
          default: false
          allow_stream: true
        top_logprobs:
          min: 0
          max: 10
          requires_logprobs: true
        logit_bias:
          enabled: true
          max_entries: 256
          min_bias: -100
          max_bias: 100
          token_id_min: 0
          token_id_semantics: served_model_tokenizer
  qwen2.5-omni-7b-thinker:
    display_name: Qwen 2.5 Omni 7B (Thinker)
    model_id: Qwen/Qwen2.5-Omni-7B
    revision: ae9e1690543ffd5c0221dc27f79834d0294cba00
    served_model_name: local-main
    # 12B와 같은 media decode stack(soundfile/librosa/PyAV)이 필요해 같은 derived image를
    # 공유한다. Gemma4 전용 패치(vision_embedder.patch_dense, feature_extractor.fft_length)는
    # 이 모델의 코드 경로와 겹치지 않아 no-op일 것으로 예상하나, 3단계 실제 부팅에서 확인한다.
    image: ${MAIN_MODEL_VLLM_IMAGE_OVERRIDE}
    compatibility:
      # 2026-08-14: 독립된 재부팅 2회에서 text/image/audio/video switch-time canary를 모두
      # 통과했고, Gateway 경유 response_format/logprobs/top_logprobs/logit_bias/
      # stream+logprobs/json_schema+logit_bias 계약까지 실측해 verified로 승격했다.
      status: compatible
    qualification:
      status: verified
    capabilities:
      # Gateway 허용 입력이자 switch-time media boot canary의 단일 source of truth다.
      deployed_input: [text, image, audio, video]
    # 0단계 조사 뒤 처음 추가하는 최소 커맨드다. Gemma 전용 tool/reasoning parser,
    # chat-template, structured-output 옵션은 넣지 않는다. max_num_seqs=4는 32K context
    # 기준 실측 KV cache 동시성 6.39와 Gateway admission 4를 맞춘 값이다.
    command:
    - --host
    - 0.0.0.0
    - --port
    - "9401"
    - --max-model-len
    - "32768"
    - --max-num-seqs
    - "4"
    - --gpu-memory-utilization
    - "0.6"
    # Qwen 전용 API 계약이다. tool calling과 reasoning은 지원하지 않아 선언하지 않는다.
    # response_format/logprobs/logit_bias는 vLLM 직접 요청으로 확인해 활성화했으며,
    # verified 승격 전에는 Gateway 경유 계약도 같은 조합으로 확인한다. Gemma와 달리
    # structured output은 별도 CLI 옵션 없이 vLLM 기본 xgrammar backend로 동작한다.
    gateway_policy:
      # 13,000-token 강제 생성도 약 59 tok/s로 HTTP 200을 완료했고 KV cache 최대
      # 점유는 6.1%였다. production upstream timeout 300초 안에 드는 상한이다. 단,
      # media가 차지한 prompt token과 출력은 32K context를 공유하므로 이 값은 보장량이
      # 아닌 요청 상한이다(720p·60초·60-frame video는 prompt 약 21.6K tokens).
      max_output_tokens: 13000
      request_limits:
        max_model_len: 32768
        input_modalities: [text, image, audio, video]
        max_image_inputs: 1
        allowed_image_url_schemes: [data]
        # max_image_pixels는 Qwen2.5-Omni-7B preprocessor_config.json(Qwen2VLImageProcessor)의
        # 실측 max_pixels다. 나머지 byte/mime 한도는 같은 decode stack을 쓰는 12B profile 값을
        # 시작점으로 재사용한 것으로, Qwen 자체 canary(2, 3단계)로 재확인 전까지는 잠정치다.
        max_image_bytes: 25000000
        max_image_pixels: 12845056
        allowed_image_mime_types: [image/jpeg, image/png, image/webp, image/avif, image/jp2, image/gif, image/bmp, image/tiff, image/x-tiff]
        max_audio_inputs: 1
        allowed_audio_formats: [wav, mp3, flac, ogg, m4a, mp4, aac]
        max_audio_bytes: 25000000
        max_video_inputs: 1
        allowed_video_url_schemes: [data]
        allowed_video_mime_types: [video/mp4, video/webm, video/x-matroska, video/quicktime, video/jpeg, video/x-msvideo, video/avi, video/gif]
        max_video_bytes: 50000000
        max_video_frames: 60
        max_video_frame_pixels: 12845056
        max_video_duration_seconds: 60
      # tool_calling/reasoning은 선언하지 않아 Gateway가 거부한다. 아래 세 기능은 vLLM
      # 직접 요청과 Gateway 경유 계약을 모두 확인했다.
      request_parameter_policy:
        allow_unlisted_parameters: false
        supported_parameters: [stream, stream_options, temperature, max_tokens, top_p, top_k, min_p, presence_penalty, frequency_penalty, repetition_penalty, stop, seed, n, response_format, logprobs, top_logprobs, logit_bias, user]
        drop_upstream_parameters: [user]
        max_n: 1
        response_format:
          enabled: true
          types: [text, json_object, json_schema]
          json_object:
            require_json_instruction: true
          json_schema:
            enabled: true
            require_root_object: true
            require_additional_properties_false: true
            strict:
              allowed: true
              require_true: false
            max_schema_bytes: 16384
            max_depth: 8
            max_total_properties: 64
            max_properties_per_object: 32
            max_required: 64
            max_enum_values: 128
            max_enum_string_length: 256
            max_property_name_length: 64
            max_total_schema_string_length: 32768
            disallowed_keywords: [allOf, not, if, then, else, dependentRequired, dependentSchemas, patternProperties, $dynamicRef, $recursiveRef, $dynamicAnchor, $recursiveAnchor, $id, $anchor]
            root_disallowed_keywords: [anyOf]
        # 2026-08-14 vLLM 직접 요청으로 실측 검증: logprobs/top_logprobs 정상 응답,
        # logit_bias는 양의 편향으로 특정 토큰 강제, 정확한 토큰 ID로 음의 편향 시 회피까지
        # 확인(최초 시도는 토큰화 경계를 잘못 짚어 다른 토큰을 편향시킨 테스트 실수였음).
        logprobs:
          enabled: true
          default: false
          allow_stream: true
        top_logprobs:
          min: 0
          max: 10
          requires_logprobs: true
        logit_bias:
          enabled: true
          max_entries: 256
          min_bias: -100
          max_bias: 100
          token_id_min: 0
          token_id_semantics: served_model_tokenizer

  cpu-gguf-text:
    catalog: configs/cpu_main_model_profiles.yaml
