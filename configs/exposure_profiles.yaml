# 지원되는 host exposure topology는 하나뿐이다.
# Gateway와 Grafana만 host에 publish하고 model/risk/operations endpoint는 Compose 내부망에 둔다.
profiles:
  private_network:
    class: default_private
    description: "Gateway와 Grafana만 host-published. vLLM, Risk Signal Service, Prometheus, DCGM, cAdvisor, Loki, Alloy는 Compose 내부망만."
    host_published:
      - gateway
      - grafana
    diagnostics:
      gateway_bypass_possible: false
      direct_model_runtime_access: false
      direct_operations_endpoints: false
      requires_exposure_audience: false
