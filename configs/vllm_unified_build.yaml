# vLLM unified Docker build의 실제 입력값이다. 일반 runtime image tag와 분리하며,
# base image 또는 호환성 pin을 바꾸면 Unified vLLM image를 다시 빌드해야 한다.
target_platform: linux/amd64
base_image_default: vllm/vllm-openai@sha256:5f5e535216848d0c52159c8c13a0af04be5f6fe1a84e79914300610796f76d40
cuda_version: "13.0"
# 명시적으로 선택해 검증하는 후보다. 기본 artifact의 승격과 분리한다.
build_variants:
  cu129:
    base_image_default: vllm/vllm-openai@sha256:58fdb6bb123a81aa53f46fa4652ad8cc87e817bd1077c9832c6258ef12c1c688
    cuda_version: "12.9"
compatibility_pins:
  # 모든 CUDA variant가 최종 이미지에서 제공해야 하는 공통 모델 라이브러리 버전이다.
  vllm: 0.30.0
  transformers: 5.17.0
  huggingface_hub: 1.32.0
