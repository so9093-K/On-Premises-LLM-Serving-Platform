# version은 이 레지스트리 스키마의 버전이며 패키지 배포 버전이 아니다.
version: 0.1.0

# Compose 서비스 identity와 실제 endpoint projection의 단일 기준이다.
# container_port: Compose 네트워크 안에서 서비스가 수신하는 고정 포트다.
# host_env_port/default_host_port: host에 직접 실행하거나 host에 publish되는 service가
# 사용할 port 환경변수와 기본값이다. internal-only service에는 두지 않는다.
# host_env_bind/default_bind: Compose가 실제 host boundary에 publish하는 service의
# bind 환경변수와 기본값이다. host-published service에만 존재한다.
# Container 내부 port는 upstream 고유값을 유지할 수 있으며 서비스별 network namespace가
# 다르므로 서로 같아도 충돌하지 않는다.
# categories: host-boundary validator와 운영 도구가 서비스 역할을 분류하는 식별자다.
#   gateway/public_entrypoint = 외부 API 진입점
#   host_process = app-only lifecycle에서 host process로 직접 실행 가능한 application service
#   model_runtime/vllm_runtime = 모델 runtime, risk_model_runtime = risk 전용 모델
#   operations_endpoint = 운영 endpoint, visualization = Grafana UI
#   metrics_backend/metrics_exporter/gpu_metrics/container_metrics/log_backend = 관측성 역할
services:
  # 외부 요청을 받아 Model Runtime과 Risk Signal Service로 전달하는 API 진입점.
  gateway:
    compose_service: gateway
    container_port: 9400
    host_env_port: GATEWAY_PORT
    default_host_port: 9400
    host_env_bind: GATEWAY_BIND_ADDR
    default_bind: "0.0.0.0"
    categories:
      - gateway
      - public_entrypoint
      - host_process

  # PII·secret·Prompt Injection detector 결과를 정규화하는 내부 Risk Signal Service.
  # Compose에서는 internal이지만 app-only lifecycle에서는 host process로 직접 실행한다.
  risk_signal_service:
    compose_service: risk-signal-service
    container_port: 9405
    host_env_port: RISK_SIGNAL_SERVICE_PORT
    default_host_port: 9405
    categories:
      - risk_signal_service
      - host_process

  # active main-model profile을 실행하는 주 대화 모델 runtime.
  main_llm_vllm:
    compose_service: main-llm-vllm
    container_port: 9401
    categories:
      - model_runtime
      - vllm_runtime

  # 범용 embedding 및 retrieval용 runtime.
  embedding_vllm:
    compose_service: embedding-vllm
    container_port: 9402
    categories:
      - model_runtime
      - vllm_runtime

  # 한국어 retrieval embedding용 runtime.
  embedding_ko_vllm:
    compose_service: embedding-ko-vllm
    container_port: 9406
    categories:
      - model_runtime
      - vllm_runtime

  # prompt injection 탐지용 단일 token 분류 runtime.
  prompt_injection_detector_runtime:
    compose_service: prompt-injection-detector-runtime
    container_port: 9403
    categories:
      - model_runtime
      - vllm_runtime
      - risk_model_runtime

  # metric 수집·rule 평가를 제공하는 Prometheus.
  prometheus:
    compose_service: prometheus
    container_port: 9090
    categories:
      - operations_endpoint
      - metrics_backend

  # 운영 대시보드를 제공하는 Grafana.
  grafana:
    compose_service: grafana
    container_port: 3000
    host_env_port: GRAFANA_PORT
    default_host_port: 9411
    host_env_bind: GRAFANA_BIND_ADDR
    default_bind: "0.0.0.0"
    categories:
      - visualization

  # NVIDIA GPU metric exporter.
  dcgm_exporter:
    compose_service: dcgm-exporter
    container_port: 9400
    categories:
      - operations_endpoint
      - metrics_exporter
      - gpu_metrics

  # container별 CPU·메모리·재시작 metric exporter.
  cadvisor:
    compose_service: cadvisor
    container_port: 8080
    categories:
      - operations_endpoint
      - metrics_exporter
      - container_metrics

  # request log 저장·조회 backend. Alloy는 조회 API가 없어 이 목록에 없다.
  loki:
    compose_service: loki
    container_port: 3100
    categories:
      - operations_endpoint
      - log_backend
