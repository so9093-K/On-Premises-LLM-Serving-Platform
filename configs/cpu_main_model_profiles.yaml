# CPU-only llama.cpp의 공통 Serving 계약. 관리형 실행은 Runtime Controller가 소유한다.
# 새 관리형 Linux는 linux-nvidia-dynamic POLICY=cpu를 사용한다.
# CPU 모델 프로필은 하나이며 문맥 상한은 runtime_limits.py의 정책이 소유한다.
version: 1
public_model: local-main
default_profile: cpu-gguf-text

runtime:
  port: 8080
  context_size: 8192
  gpu_layers: 0
  parallel: 1
  threads: 4

profiles:
  cpu-gguf-text:
    display_name: Local GGUF Text Chat (CPU / llama.cpp)
    served_model_name: local-main
    compatibility:
      status: compatible
    qualification:
      # 2026-10-21 실장비 검증은 문맥 2K / 출력 256이었다.
      # 8K / 4K 정책은 동일 실장비에서 아직 검증하지 않았다.
      status: unverified
    capabilities:
      deployed_input: [text]
    gateway_policy:
      max_concurrency: 1
      max_output_tokens: 4096
      request_limits:
        max_model_len: 8192
        input_modalities: [text]
      request_parameter_policy:
        allow_unlisted_parameters: false
        supported_parameters: [stream, stream_options, temperature, max_tokens, top_p, top_k, stop, seed]
        max_n: 1

