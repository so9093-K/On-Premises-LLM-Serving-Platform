# 에러 코드 카탈로그 — 사용자/운영자용 "의미 레이어"의 단일 소스.
#
# status·retryable의 런타임 권위는 errors.py의 ERROR_DEFINITIONS이다(SSE-only 포함).
# 이 파일은 사용자/운영자 오류 의미를 나타낸다. 오류 코드·상태의 Runtime authority는
# errors.py 및 공개 API 계약이며 변경 시 그 의미를 함께 확인한다.
# code 집합을 함께 검사한다. 따라서 status는 여기 중복하지 않고, 이 파일은 code별
# 서술 메타데이터(meaning/action)만 담는다.
#
# 소비처:
#  - 생성 OpenAPI 에러 응답의 status별 code gloss   (src/ai_model_serving/openapi_contracts.py)
#
# ERROR_STATUS·ERROR_RETRYABLE은 위 정의에서 파생한 조회 표다.
# meaning/action 값은 콜론을 포함할 수 있어 따옴표로 감싼다.
schema_version: 1
errors:
  VALIDATION_ERROR:
    meaning: "요청이 Gateway 입력 계약 검증을 통과하지 못했다."
    action: "error.param 이 가리키는 필드를 message 지시대로 수정한다."
  UNAUTHORIZED:
    meaning: "API 키 또는 인증 정보가 없거나 유효하지 않다."
    action: "유효한 Authorization 헤더(API 키)를 포함해 다시 호출한다."
  FORBIDDEN:
    meaning: "인증은 되었으나 해당 작업을 수행할 권한이 없다."
    action: "필요한 권한/프로필로 호출하거나 운영자에게 문의한다."
  NOT_FOUND:
    meaning: "요청한 리소스(경로·작업 ID 등)가 존재하지 않는다."
    action: "요청 경로와 식별자를 확인한다."
  METHOD_NOT_ALLOWED:
    meaning: "해당 경로에서 요청한 HTTP 메서드를 지원하지 않는다."
    action: "Allow 응답 헤더와 API 문서에서 지원하는 메서드를 확인한다."
  CONFLICT:
    meaning: "현재 리소스 상태와 요청이 충돌해 작업을 수행할 수 없다."
    action: "error.details.reason 또는 message를 확인한 뒤, 진행 중인 작업 완료·명시적 확인 등 충돌 원인을 해결한다."
  PRECONDITION_REQUIRED:
    meaning: "상태 변경 요청에 필요한 리비전 사전 조건이 빠졌거나 형식이 잘못됐다."
    action: "GET /admin/config/effective 또는 plan 응답의 ETag를 If-Match 헤더로 보내 다시 요청한다."
  CONFIG_REVISION_CONFLICT:
    meaning: "검토한 설정 리비전 또는 변경 계획이 현재 상태와 달라졌다."
    action: "현재 적용된 설정을 다시 읽고 새 변경 계획을 검토한 뒤 적용한다."
  CONFIGURATION_WRITE_UNAVAILABLE:
    meaning: "설정 저장소·적용 상태·작업 이력에 문제가 있어 변경을 시작할 수 없다."
    action: "error.details.reason을 확인하고 persistent state·pending operation·revision drift를 복구한 뒤 다시 plan한다."
  CONFIGURATION_APPLY_FAILED:
    meaning: "운영자 설정 저장 후 런타임 적용 또는 검증이 완료되지 못했다."
    action: "operation_id와 error.details의 phase·revision 상태를 확인한다. 재시작 시 persisted desired state가 다시 hydrate된다."
  RUNTIME_HISTORY_UNAVAILABLE:
    meaning: "런타임 작업 이력을 읽거나 기록할 수 없어 상태 변경을 시작할 수 없다."
    action: "persistent platform state와 runtime-history 디렉터리를 복구한 뒤 새 Plan을 검토해 다시 Apply한다."
  RUNTIME_VERIFICATION_FAILED:
    meaning: "런타임 상태 변경 후 실제 상태가 목표와 일치하는지 확인하지 못했다."
    action: "error.details.operation_id와 /admin/runtimes/operations 기록을 확인하고 현재 runtime 상태를 다시 조회한다. 자동 재실행하지 않는다."
  GPU_BUDGET_EXCEEDED:
    meaning: "요청한 런타임을 시작할 GPU 정책 예약 예산이 부족하다."
    action: "새 런타임 변경 계획에서 중지 대상과 영향을 확인한다. 자동 중지를 허용하려면 force=true로 계획을 다시 검토하고 해당 plan_digest로 적용한다."
  MODEL_UNAVAILABLE:
    meaning: "대상 모델 런타임을 현재 사용할 수 없다(미기동·축출 등)."
    action: "잠시 후 재시도하거나 런타임 상태(/admin/runtimes)를 확인한다."
  MODEL_CAPABILITY_MISMATCH:
    meaning: "요청이 활성 모델이 지원하지 않는 기능을 요구한다(예 - 비활성 모달리티)."
    action: "활성 프로필이 지원하는 입력/기능으로 요청을 맞춘다."
  UPSTREAM_TIMEOUT:
    meaning: "모델 런타임 응답이 제한 시간을 초과했다."
    action: "잠시 후 재시도하거나 요청 크기·복잡도를 줄인다."
  UPSTREAM_ERROR:
    meaning: "모델 런타임이 오류를 반환했거나 통신에 실패했다."
    action: "잠시 후 재시도한다. 반복되면 런타임 로그를 확인한다."
  UPSTREAM_RESPONSE_INVALID:
    meaning: "의존 서비스 응답의 구조·필드 또는 탐지기 출력이 계약을 만족하지 못했다."
    action: "반복되면 request_id로 운영 로그와 runtime 호환성을 확인한다."
  STRUCTURED_OUTPUT_INVALID:
    meaning: "모델이 생성한 JSON이 요청한 출력 형식 또는 json_schema를 만족하지 못했다."
    action: "response_format.json_schema 를 단순화하거나 max_tokens 를 늘린다."
  RATE_LIMITED:
    meaning: "의존 서비스의 요청 제한에 도달했다."
    action: "Retry-After 를 존중해 백오프 후 재시도한다."
  QUEUE_TIMEOUT:
    meaning: "동시 처리 한도로 대기열에서 시간이 초과됐다."
    action: "잠시 후 재시도하고 동시 요청 수를 줄인다."
  CIRCUIT_OPEN:
    meaning: "연속 실패로 의존 서비스 호출이 일시 차단됐다."
    action: "잠시 후 재시도한다."
  REQUEST_TOO_LARGE:
    meaning: "요청 본문이 허용 한도를 초과했다."
    action: "요청 본문(이미지·오디오·비디오·문서) 크기를 한도 이하로 줄인다."
  INTERNAL_ERROR:
    meaning: "Gateway 내부 처리 중 예기치 못한 오류가 발생했다."
    action: "request_id 와 함께 운영자에게 문의한다."
  DETECTOR_DISABLED:
    meaning: "요청한 위험 탐지기가 현재 설정에서 비활성이다."
    action: "운영자에게 활성화를 요청하거나 다른 탐지기를 사용한다."
  STREAM_LIMIT_EXCEEDED:
    meaning: "스트리밍 응답이 청크 수·전송 시간·크기 한도를 초과했다."
    action: "출력 길이를 줄이거나 비스트리밍으로 재시도한다."
  MAIN_MODEL_CONTROL_UNAVAILABLE:
    meaning: "메인 모델 Runtime Controller를 사용할 수 없다."
    action: "잠시 후 재시도한다. 반복되면 Runtime Controller 상태를 확인한다."
  MAIN_MODEL_SWITCH_IN_PROGRESS:
    meaning: "메인 모델 프로필 전환이 진행 중이다."
    action: "전환 완료(operation 상태) 후 재시도한다."
